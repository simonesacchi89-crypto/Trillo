<title>Zing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&family=VT323&display=swap">
<style>
/* Layout: telefono glossy al centro su un cielo Y2K, guida accanto su desktop e sotto su telefono. Un solo look, chiaro, voluto. */
:root{
  --sky-top:#4cb6ff; --sky-mid:#a6e0ff; --sky-low:#eaf8ff;
  --aqua:#1a96e6; --aqua-deep:#0f6fbf; --ink:#13304f; --muted:#56739a;
  --paper:#ffffff; --panel:#f2f9ff; --line:#c6e3f8; --pink:#ff4f9a; --pink-deep:#c21f6a;
  --lime:#7fdc2f; --lime-deep:#4fa816; --sun:#ffc62e; --cream:#fff6d1;
  --font-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --font-pixel:"VT323",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.4;
  background:
    radial-gradient(circle at 10% 16%, rgb(255 255 255 / .8) 0 56px, transparent 57px),
    radial-gradient(circle at 18% 22%, rgb(255 255 255 / .55) 0 28px, transparent 29px),
    radial-gradient(circle at 88% 10%, rgb(255 255 255 / .6) 0 90px, transparent 91px),
    radial-gradient(circle at 80% 86%, rgb(255 255 255 / .5) 0 130px, transparent 131px),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  background-color:var(--sky-mid);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink); outline-offset:2px}
svg{overflow:visible}

.stage{display:grid; grid-template-columns:minmax(0,400px) minmax(0,340px); gap:40px; justify-content:center; align-items:start; max-width:830px; margin:0 auto}
@media (max-width:800px){ .stage{grid-template-columns:minmax(0,430px); gap:24px} }

/* ---------- Telefono ---------- */
.phone{
  position:relative; display:flex; flex-direction:column; overflow:hidden;
  height:min(800px, calc(100dvh - 48px)); min-height:600px;
  background:var(--paper); border-radius:34px; border:3px solid var(--paper);
  box-shadow:0 0 0 2px var(--aqua), 0 28px 60px rgb(19 48 79 / .35);
}
.topbar{
  position:relative; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center;
  padding:14px 14px 12px; color:var(--paper);
  background:linear-gradient(180deg, #5cc2ff 0%, var(--aqua) 55%, var(--aqua-deep) 100%);
}
.topbar::after{content:""; position:absolute; inset:0 0 52% 0; background:linear-gradient(180deg, rgb(255 255 255 / .45), rgb(255 255 255 / .05)); pointer-events:none}
.topbar > *{position:relative; z-index:1}
.me-nick{font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.me-row{display:flex; gap:6px; align-items:center; min-width:0}
.status-select{appearance:none; border:1px solid rgb(255 255 255 / .6); background:rgb(255 255 255 / .2); color:var(--paper); border-radius:999px; padding:1px 10px; font-size:12px; font-weight:800; max-width:120px}
.status-select option{color:var(--ink)}
.pm{width:100%; border:0; border-bottom:1px dashed transparent; background:transparent; color:var(--paper); font-size:12.5px; padding:2px 0; font-style:italic}
.pm::placeholder{color:rgb(255 255 255 / .75)}
.pm:focus{outline:none; border-bottom-color:rgb(255 255 255 / .8)}
.brand{display:grid; justify-items:end; gap:4px}
.logo{font-family:var(--font-display); font-size:26px; line-height:1; letter-spacing:.5px; color:var(--paper); text-shadow:0 2px 0 var(--pink-deep), 0 0 12px rgb(255 79 154 / .5); transform:rotate(-4deg)}
.lang{display:flex; border-radius:999px; border:1px solid rgb(255 255 255 / .6); overflow:hidden}
.lang button{border:0; background:transparent; color:var(--paper); font-size:11px; font-weight:800; padding:2px 8px}
.lang button.on{background:var(--paper); color:var(--aqua-deep)}

.ava{
  --c:var(--aqua); flex:none; position:relative; width:44px; height:44px; border-radius:50%;
  display:grid; place-items:center; font-family:var(--font-display); font-size:19px; color:var(--paper);
  background:radial-gradient(circle at 34% 26%, rgb(255 255 255 / .75) 0 16%, transparent 34%), var(--c);
  box-shadow:inset 0 -4px 8px rgb(0 0 0 / .18), 0 0 0 2px var(--paper);
  text-shadow:0 1px 2px rgb(0 0 0 / .3);
}
.ava.sm{width:36px; height:36px; font-size:16px}
.ava.xl{width:96px; height:96px; font-size:42px}
.dot{position:absolute; right:-2px; bottom:-2px; width:14px; height:14px; border-radius:50%; background:var(--s); border:2.5px solid var(--paper); box-shadow:inset 0 2px 2px rgb(255 255 255 / .6)}

.screens{flex:1; overflow-y:auto; background:var(--panel); overscroll-behavior:contain}
.tabs{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); background:var(--paper); padding:6px 6px 8px}
.tab{position:relative; display:grid; justify-items:center; gap:2px; padding:6px 0; border:0; background:transparent; border-radius:14px; font-size:11.5px; font-weight:800; color:var(--muted)}
.tab svg{width:24px; height:24px}
.tab.on{color:var(--aqua-deep); background:linear-gradient(180deg, #e3f4ff, #c9e8ff)}
.tab .badge{position:absolute; top:2px; right:22%}

/* ---------- Amici ---------- */
.stories{display:flex; gap:14px; overflow-x:auto; padding:14px 14px 10px; background:var(--paper); border-bottom:1px solid var(--line)}
.story{display:grid; justify-items:center; gap:4px; border:0; background:transparent; padding:0; width:64px; flex:none}
.ring{padding:3px; border-radius:50%; background:conic-gradient(var(--pink), var(--sun), var(--lime), var(--aqua), var(--pink))}
.story.seen .ring{background:var(--line)}
.story .ava{width:52px; height:52px; font-size:22px}
.story-name{font-size:11px; font-weight:600; max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.group{font-family:var(--font-pixel); font-size:19px; color:var(--muted); padding:12px 16px 4px; letter-spacing:.5px}
.friend{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:6px; padding:0 10px 0 0}
.friend-main{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; text-align:left; border:0; background:transparent; padding:9px 6px 9px 16px; border-radius:16px; min-width:0}
.friend-main:hover{background:rgb(26 150 230 / .07)}
.f-text{min-width:0}
.f-text > span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.f-name{font-weight:800}
.f-pm{font-size:12.5px; color:var(--muted); font-style:italic}
.f-listen{font-size:11.5px; color:var(--aqua-deep)}
.f-listen::before{content:"\266B  "}
.badge{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--pink); color:var(--paper); font-size:11px; font-weight:800; box-shadow:inset 0 2px 2px rgb(255 255 255 / .45)}
.badge.zing{background:var(--sun); color:var(--ink); animation:wiggle 1.2s infinite}
.bell{border:1.5px dashed var(--aqua); background:var(--paper); color:var(--aqua-deep); border-radius:999px; font-size:11.5px; font-weight:800; padding:4px 10px; white-space:nowrap}
.bell.on{border-style:solid; background:#e3f4ff}

/* ---------- Chat ---------- */
.chat{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; background:var(--panel)}
.chat-head{position:relative; display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 12px 10px; color:var(--paper); background:linear-gradient(180deg, #5cc2ff 0%, var(--aqua) 55%, var(--aqua-deep) 100%)}
.chat-head::after{content:""; position:absolute; inset:0 0 52% 0; background:linear-gradient(180deg, rgb(255 255 255 / .4), rgb(255 255 255 / .04)); pointer-events:none}
.chat-head > *{position:relative; z-index:1}
.ch-info{min-width:0}
.ch-info b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ch-info small{display:block; font-size:12px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon-btn{display:grid; place-items:center; width:38px; height:38px; border-radius:50%; border:1.5px solid rgb(255 255 255 / .6); background:rgb(255 255 255 / .18); color:var(--paper); padding:0}
.icon-btn svg{width:20px; height:20px}
.icon-btn.heart.on{background:var(--pink); border-color:var(--paper)}
.msgs{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:14px 12px; background:radial-gradient(var(--line) 1px, transparent 1.4px) 0 0 / 18px 18px, var(--panel)}
.msg{display:flex}
.msg.mine{justify-content:flex-end}
.bubble{position:relative; max-width:84%; padding:8px 12px; border-radius:18px; background:var(--paper); border:1.5px solid var(--line); box-shadow:0 2px 0 rgb(19 48 79 / .06); display:grid; gap:4px; justify-items:start; min-width:0}
.bubble::before{content:""; position:absolute; inset:2px 8px auto 8px; height:40%; border-radius:14px; background:linear-gradient(180deg, rgb(255 255 255 / .8), rgb(255 255 255 / 0)); pointer-events:none}
.msg.mine .bubble{background:linear-gradient(180deg, #ecffd9, #c9f3a0); border-color:#a6dc74; border-bottom-right-radius:6px; justify-items:end}
.msg.theirs .bubble{border-bottom-left-radius:6px}
.bubble p{margin:0; position:relative; overflow-wrap:anywhere}
.emo-inline svg{vertical-align:-6px}
.strip{position:relative; display:flex; align-items:flex-end; max-width:100%; overflow-x:auto; padding-top:6px}
.strip > *{flex:none}
.strip .p-bug + .p-bug{margin-left:-14px}
.strip .emo + .emo{margin-left:-2px}
.strip.single{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.emo-name{font-size:11.5px; font-weight:800; color:var(--muted)}
.grab{border:0; border-radius:999px; padding:6px 16px; font-weight:800; color:var(--ink); background:linear-gradient(180deg, #fff2a8 0%, var(--sun) 55%, #f2a400 100%); box-shadow:inset 0 2px 1px rgb(255 255 255 / .7), 0 2px 0 #c98700; animation:bob 1.6s ease-in-out infinite}
.took{font-size:12px; font-weight:800; color:var(--lime-deep)}
.took.muted{color:var(--muted)}
.rar-chip{--r:var(--muted); display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--paper); background:var(--r); padding:2px 9px; border-radius:999px; box-shadow:inset 0 2px 1px rgb(255 255 255 / .45)}
.sys{align-self:center; max-width:90%; text-align:center; font-size:12.5px; font-weight:600; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 12px}
.zing-pill{font-family:var(--font-pixel); font-size:19px; color:var(--ink); background:var(--cream); border:2px dashed var(--sun)}
.combo-pill{font-family:var(--font-display); font-size:15px; color:var(--paper); background:linear-gradient(90deg, var(--pink), var(--sun)); border:0; letter-spacing:1px}
.typing{min-height:20px; padding:0 14px; font-size:12px; font-style:italic; color:var(--muted)}
.mixbar{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 10px; background:var(--cream); border-top:1px solid var(--line)}
.mixbar .strip{padding-top:4px}
.mixbar .strip button{border:0; background:transparent; padding:0}
.mix-clear{border:1.5px solid var(--sun); background:var(--paper); border-radius:999px; font-size:12px; font-weight:800; padding:4px 10px}
.tray{background:var(--paper); border-top:1px solid var(--line); max-height:190px; overflow-y:auto; padding:6px 10px 8px}
.tray-hint{font-size:12px; color:var(--muted); margin:0 0 4px}
.tray-label{font-family:var(--font-pixel); font-size:16px; color:var(--muted); margin:4px 0 2px}
.tray-grid{display:flex; flex-wrap:wrap; gap:4px}
.tray-grid button{border:1px solid transparent; background:transparent; border-radius:12px; padding:3px}
.tray-grid button:hover{background:var(--panel); border-color:var(--line)}
.composer{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:6px; align-items:center; padding:8px 10px 4px; background:var(--paper); border-top:1px solid var(--line)}
.composer .icon-btn{border-color:var(--line); background:var(--panel); color:var(--aqua-deep)}
.composer input{min-width:0; border:1.5px solid var(--line); border-radius:999px; padding:9px 14px; background:var(--panel)}
.composer input:focus{outline:none; border-color:var(--aqua)}
.zing-btn{border:0; border-radius:999px; padding:9px 14px; min-width:78px; font-family:var(--font-display); font-size:16px; letter-spacing:.5px; color:var(--paper); background:linear-gradient(180deg, #ff9ccb 0%, var(--pink) 55%, var(--pink-deep) 100%); box-shadow:inset 0 2px 1px rgb(255 255 255 / .6), 0 3px 0 #8e0f4b}
.zing-btn:disabled{filter:grayscale(.7); opacity:.75; cursor:default}
.chat-foot{padding:2px 14px 8px; background:var(--paper); font-family:var(--font-pixel); font-size:16px; color:var(--muted)}

/* ---------- Album, Studio, Profilo ---------- */
.pad{padding:16px}
h2{font-family:var(--font-display); font-weight:400; font-size:26px; margin:0; color:var(--aqua-deep); text-wrap:balance}
h3{font-family:var(--font-display); font-weight:400; font-size:22px; margin:0; color:var(--aqua-deep); text-wrap:balance}
.small{font-size:12.5px; color:var(--muted); margin:4px 0 0}
.prog{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; margin-top:10px; font-family:var(--font-pixel); font-size:19px}
.prog-bar{height:16px; border-radius:999px; background:var(--paper); border:1.5px solid var(--line); overflow:hidden}
.prog-bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(180deg, #c8ff8a, var(--lime) 55%, var(--lime-deep))}
.rar-sec{padding:6px 16px 10px}
.rar-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:var(--font-pixel); font-size:18px; color:var(--muted)}
.emo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(70px,1fr)); gap:8px}
.tile{display:grid; justify-items:center; gap:2px; padding:8px 4px 6px; border-radius:16px; border:1.5px solid var(--line); background:var(--paper); font-size:11px; font-weight:800; color:var(--ink); min-width:0}
.tile span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile:hover{border-color:var(--aqua)}
.tile.missing{background:transparent; border-style:dashed; color:var(--muted)}
.tile.missing svg, .silhouette svg{filter:brightness(0); opacity:.13}
.tile.missing svg *, .silhouette svg *{animation:none !important}

.studio-hero{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center; margin-bottom:8px}
.preview{display:grid; place-items:center; width:128px; height:128px; border-radius:26px; background:radial-gradient(circle at 50% 40%, var(--paper), #d7eeff); border:2px solid var(--line)}
.opt{margin-top:12px}
.opt-label{display:block; font-family:var(--font-pixel); font-size:18px; color:var(--muted); margin:14px 0 6px; letter-spacing:.3px}
.opt .opt-label{margin-top:0}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:grid; place-items:center; min-width:46px; height:46px; border-radius:14px; border:1.5px solid var(--line); background:var(--paper); padding:0 8px; font-size:12.5px; font-weight:800}
.chip.on{border:2.5px solid var(--pink); background:#fff0f7}
.sw{width:26px; height:26px; border-radius:50%; box-shadow:inset 0 -3px 5px rgb(0 0 0 / .2), inset 0 3px 3px rgb(255 255 255 / .6)}
.field{width:100%; border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--paper)}
.field:focus{outline:none; border-color:var(--aqua)}
.btn-gloss{display:block; width:100%; margin-top:12px; border:0; border-radius:999px; padding:12px 18px; font-family:var(--font-display); font-size:17px; letter-spacing:.4px; color:var(--paper); background:linear-gradient(180deg, #7fd0ff 0%, var(--aqua) 55%, var(--aqua-deep) 100%); box-shadow:inset 0 2px 1px rgb(255 255 255 / .6), 0 3px 0 #0b4f8a}
.btn-gloss.pink{background:linear-gradient(180deg, #ff9ccb 0%, var(--pink) 55%, var(--pink-deep) 100%); box-shadow:inset 0 2px 1px rgb(255 255 255 / .6), 0 3px 0 #8e0f4b}
.creations{display:grid; gap:8px; margin-top:16px}
.creation{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 12px; border-radius:16px; background:var(--paper); border:1.5px solid var(--line)}
.state{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--cream); color:var(--ink)}
.state.ok{background:var(--lime); color:var(--ink)}

.profile{display:grid; justify-items:center; text-align:center; padding:20px 16px}
.profile > .field, .profile > .opt-label, .profile > .vetrina, .profile > .stats, .profile > .settings, .profile > .left{justify-self:stretch; text-align:left}
.pf-ava{padding:6px; border-radius:50%; background:conic-gradient(from 200deg, var(--r), var(--paper), var(--r), var(--paper), var(--r)); box-shadow:0 6px 18px rgb(19 48 79 / .2); margin-bottom:8px}
.vetrina{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.stat{padding:10px 12px; border-radius:16px; background:var(--paper); border:1.5px solid var(--line)}
.stat b{display:block; font-family:var(--font-display); font-weight:400; font-size:24px; color:var(--pink); font-variant-numeric:tabular-nums}
.stat span{font-size:12px; font-weight:600; color:var(--muted)}
.settings{display:grid; gap:8px}
.setting{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 10px; align-items:start; padding:10px 12px; border-radius:16px; background:var(--paper); border:1.5px solid var(--line); font-weight:600}
.setting small{grid-column:2; font-weight:400; color:var(--muted); font-size:12px}
.setting input{margin-top:3px; accent-color:var(--pink)}

/* ---------- Overlay, sheet, toast ---------- */
.overlay{position:absolute; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:rgb(19 48 79 / .55); backdrop-filter:blur(3px)}
.overlay.story{padding:0; background:var(--ink)}
.card-fig{--r:var(--aqua); width:min(260px,100%); display:grid; justify-items:center; gap:6px; padding:22px 18px 18px; text-align:center; border-radius:22px; background:var(--paper); border:6px solid var(--r); box-shadow:0 0 0 3px var(--paper), 0 18px 40px rgb(0 0 0 / .35); animation:flip .7s cubic-bezier(.3,1.4,.5,1)}
.card-fig p{margin:0; font-size:13px}
.card-fig .strip{justify-content:center}
.fig-tag{font-family:var(--font-pixel); font-size:20px; color:var(--pink); letter-spacing:2px}
.combo, .destiny{display:grid; justify-items:center; gap:8px; text-align:center; color:var(--paper)}
.combo h2, .destiny h2{font-size:44px; line-height:.95; color:var(--paper); text-shadow:0 3px 0 var(--pink-deep), 0 0 24px rgb(255 198 46 / .8); animation:zoom .6s cubic-bezier(.3,1.6,.5,1)}
.combo p, .destiny p{margin:0; max-width:28ch; font-weight:600}
.combo .btn-gloss, .destiny .btn-gloss{max-width:240px}
.combo-emos{display:flex; gap:4px}
.ce.left{animation:clashL .8s ease-in-out 2}
.ce.right{animation:clashR .8s ease-in-out 2}
.hearts{font-family:var(--font-display); font-size:64px; color:var(--pink); animation:beat 1s ease-in-out infinite}
.gift{display:grid; justify-items:center; gap:4px; padding:12px 18px; border-radius:20px; background:rgb(255 255 255 / .14); border:1.5px solid rgb(255 255 255 / .4)}
.story-view{position:relative; width:100%; height:100%; display:grid; grid-template-rows:auto auto 1fr auto; padding:12px 16px 28px; color:var(--paper)}
.sv-bar{height:4px; border-radius:4px; background:rgb(255 255 255 / .35); overflow:hidden}
.sv-bar i{display:block; height:100%; width:0; background:var(--paper); animation:fill 7s linear forwards}
.sv-head{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; margin-top:10px}
.sv-head small{display:block; font-size:12px; opacity:.85}
.sv-x{width:38px; height:38px; border-radius:50%; border:0; background:rgb(0 0 0 / .2); color:var(--paper); font-size:22px; line-height:1}
.sv-text{align-self:center; margin:0; text-align:center; font-family:var(--font-display); font-size:34px; line-height:1.05; text-shadow:0 3px 0 rgb(0 0 0 / .2); text-wrap:balance}
.sv-sticker{justify-self:center; display:grid; justify-items:center; gap:6px; padding:12px 18px; border-radius:22px; background:rgb(255 255 255 / .9); color:var(--ink); transform:rotate(-5deg); box-shadow:0 8px 20px rgb(0 0 0 / .2)}
.sv-sticker span{font-weight:800; font-size:13px}
.sv-sticker em{font-size:12px; color:var(--muted)}
.sheet-wrap{position:absolute; inset:0; z-index:15; display:flex; align-items:flex-end; background:rgb(19 48 79 / .4)}
.sheet{width:100%; display:grid; gap:6px; padding:20px 18px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius:24px 24px 0 0; background:var(--paper); animation:up .3s ease-out; max-height:85%; overflow-y:auto}
.sheet p{margin:0}
.sheet .center{display:grid; justify-items:center; gap:6px; text-align:center}
.toast{position:absolute; top:84px; left:14px; right:14px; z-index:25; display:flex; align-items:center; gap:10px; text-align:left; padding:10px 14px; border-radius:16px; border:2px solid var(--aqua); background:var(--paper); box-shadow:0 10px 26px rgb(19 48 79 / .25); font-weight:700; animation:down .3s ease-out}

/* ---------- Guida ---------- */
.guide{padding:22px; border-radius:26px; background:rgb(255 255 255 / .82); border:2px solid var(--paper); box-shadow:0 14px 34px rgb(19 48 79 / .18); min-width:0}
.guide h1{font-family:var(--font-display); font-weight:400; font-size:56px; line-height:1; margin:0; color:var(--aqua); text-shadow:0 3px 0 var(--aqua-deep); transform:rotate(-3deg); transform-origin:left}
.guide .tag{font-family:var(--font-pixel); font-size:20px; color:var(--pink); margin:8px 0 14px}
.guide ol{margin:0; padding-left:20px; display:grid; gap:8px}
.guide code{font-family:var(--font-pixel); font-size:18px; background:var(--cream); padding:0 5px; border-radius:6px}
.guide .note{font-size:12.5px; color:var(--muted); margin:14px 0 0}

/* ---------- Emoticon animate ---------- */
.emo .face, .piece .part{transform-box:fill-box; transform-origin:50% 90%}
.a-bounce .face{animation:e-bounce 1.4s ease-in-out infinite}
.a-wobble .face{animation:e-wobble 1.8s ease-in-out infinite}
.a-pulse .face{transform-origin:50% 50%; animation:e-pulse .9s ease-in-out infinite}
.a-float .face{animation:e-float 2.6s ease-in-out infinite}
.a-shiver .face{animation:e-shiver .32s linear infinite}
.emo .blink{transform-box:fill-box; transform-origin:50% 50%; animation:e-blink 3.8s infinite}
.wheel{transform-box:fill-box; transform-origin:50% 50%; animation:spin .9s linear infinite}
.smoke{animation:smoke 1.5s ease-out infinite}
.flame{transform-box:fill-box; transform-origin:0% 50%; animation:flick .16s ease-in-out infinite alternate}
.p-train .part{animation:chug .45s ease-in-out infinite}
.p-rocket .part{animation:e-float 1.6s ease-in-out infinite}
.p-bug .part{animation:wave 1s ease-in-out infinite; animation-delay:calc(var(--i, 0) * -.16s)}
.still, .still *{animation:none !important}

@keyframes e-bounce{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-5px) scale(.97,1.03)}80%{transform:translateY(0) scale(1.04,.96)}}
@keyframes e-wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes e-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes e-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes e-shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px) rotate(-2deg)}75%{transform:translateX(1.5px) rotate(2deg)}}
@keyframes e-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes smoke{0%{transform:translate(0,4px); opacity:0}30%{opacity:.9}100%{transform:translate(6px,-8px); opacity:0}}
@keyframes flick{from{transform:scaleX(.7)}to{transform:scaleX(1.12)}}
@keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- Animazioni interfaccia ---------- */
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-10px,3px) rotate(-1deg)}20%{transform:translate(9px,-4px) rotate(1deg)}30%{transform:translate(-8px,4px)}40%{transform:translate(8px,-2px) rotate(.6deg)}50%{transform:translate(-6px,3px)}60%{transform:translate(5px,-3px)}70%{transform:translate(-3px,2px)}80%{transform:translate(3px,-1px)}90%{transform:translate(-1px,1px)}}
.shake{animation:shake .65s}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
@keyframes flip{0%{transform:perspective(600px) rotateY(180deg) scale(.6)}100%{transform:perspective(600px) rotateY(0) scale(1)}}
@keyframes zoom{0%{transform:scale(.2) rotate(-10deg)}100%{transform:scale(1) rotate(-3deg)}}
@keyframes clashL{0%,100%{transform:translateX(0)}50%{transform:translateX(18px) rotate(12deg)}}
@keyframes clashR{0%,100%{transform:translateX(0)}50%{transform:translateX(-18px) rotate(-12deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes fill{to{width:100%}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes down{from{transform:translateY(-30px); opacity:0}to{transform:translateY(0); opacity:1}}
@keyframes flash{50%{filter:brightness(1.3) saturate(1.4)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important}
  .shake{animation:flash .6s !important}
}
@media (max-width:440px){ .phone{border-radius:26px} .guide h1{font-size:46px} }

/* ---------- Chat ---------- */
function withShortcuts(s){
  return esc(s).replace(SC_RE, (m, pre, code) => {
    const e = SC.find(x => x.sc === code);
    return S.owned[e.id] ? pre + `<span class="emo-inline" title="${esc(nm(e))}">${emoSVG(e.s, 24)}</span>` : m;
  });
}
const stripHTML = (ids, size) => `<div class="strip ${ids.length === 1 ? 'single' : ''}">${ids.map((id, k) => itemSVG(E(id), size, k)).join('')}</div>`;
function msgHTML(m, idx){
  const i = S.chat;
  if (m.t === 'zing') return `<div class="sys zing-pill">${m.from === 'me' ? t('zing_sent') : esc(t('zing_recv', {name:F[i].name}))}</div>`;
  if (m.t === 'combo') return `<div class="sys combo-pill">${t('combo')}</div>`;
  if (m.t === 'sys') return `<div class="sys">${esc(tx(m.text))}</div>`;
  const mine = m.from === 'me';
  let b = '';
  if (m.text) b += `<p>${mine ? withShortcuts(m.text) : esc(tx(m.text))}</p>`;
  if (m.strip){
    const single = m.strip.length === 1, e0 = E(m.strip[0]);
    b += stripHTML(m.strip, single ? 64 : 46);
    if (single) b += `<span class="emo-name">${esc(nm(e0))}</span>`;
    if (!mine){
      const miss = [...new Set(m.strip)].filter(id => !S.owned[id]);
      if (m.taken && !miss.length) b += `<span class="took">${t('taken')}</span>`;
      else if (!miss.length) b += `<span class="took muted">${t('have')}</span>`;
      else {
        const top = miss.map(E).sort((x, y) => Object.keys(RAR).indexOf(y.r) - Object.keys(RAR).indexOf(x.r))[0];
        b += `<span class="rar-chip" style="--r:${RAR[top.r].c}">${rl(top.r)}</span><button class="grab" data-take="${idx}">${miss.length > 1 ? t('grab_n', {n:miss.length}) : t('grab')}</button>`;
      }
    }
  }
  return `<div class="msg ${mine ? 'mine' : 'theirs'}"><div class="bubble">${b}</div></div>`;
}
function renderMessages(){
  const box = $('#msgs');
  box.innerHTML = S.chats[S.chat].map(msgHTML).join('') || `<div class="sys">${t('no_msgs')}</div>`;
  box.scrollTop = box.scrollHeight;
}

function renderTyping(){ $('#typing').textContent = S.typing && S.typing === S.chat ? t('typing', {name:F[S.chat].name}) : ''; }

function updateZingBtn(){
  if (!S.chat) return;
  const left = (S.cool[S.chat] || 0) - Date.now(), btn = $('#zingBtn');
  btn.disabled = left > 0; btn.textContent = left > 0 ? Math.ceil(left / 1000) + ' s' : 'Zing!';
  $('#chatFoot').textContent = t('foot', {n:S.today});
}
setInterval(updateZingBtn, 250);

function openChat(i){
  S.chat = i; S.unread[i] = 0; S.zingedMe[i] = false; S.mix = [];
  $('#chat').hidden = false; $('#tray').hidden = true; renderTray(); renderMix();
  if (F[i].status === 'offline' && !S.chats[i].length) S.chats[i].push({t:'sys', text:n2(STR.en.offline_note.replace('{name}', F[i].name), STR.it.offline_note.replace('{name}', F[i].name))});
  renderChat(); renderTabs();
}
function closeChat(){ $('#chat').hidden = true; S.chat = null; renderAll(); }

function addMsg(i, m, quiet){
  S.chats[i].push(m);
  const open = S.chat === i && !$('#chat').hidden;
  if (open) renderMessages();
  else {
    if (m.from !== 'me' && !m.t){ S.unread[i] = (S.unread[i] || 0) + 1; if (!quiet) toast(`${F[i].name}: ${m.text ? tx(m.text) : t('sent_emo')}`, i); }
    renderTabs(); if (S.tab === 'amici') renderScreen();
  }
}
const timers = {};
function scheduleReply(i, delay){
  const f = F[i]; if (f.status === 'offline') return;
  clearTimeout(timers[i]);
  timers[i] = setTimeout(() => {
    S.typing = i; if (S.chat === i) renderTyping();
    timers[i] = setTimeout(() => {
      S.typing = null; if (S.chat === i) renderTyping();
      const k = Math.floor(Math.random() * f.replies.en.length), m = {from:i, text:n2(f.replies.en[k], f.replies.it[k])};
      if (Math.random() < .45){ const p = pick(f.pool); m.strip = Array.isArray(p) ? p : [p]; }
      addMsg(i, m);
    }, 1200 + Math.random() * 900);
  }, delay);
}
function sendMessage(text){
  const i = S.chat; text = text.trim();
  if (!text && !S.mix.length) return;
  const m = {from:'me'}; if (text) m.text = text; if (S.mix.length) m.strip = S.mix.slice();
  S.mix = []; renderMix(); $('#tray').hidden = true;
  addMsg(i, m); scheduleReply(i, 900);
}

/* ---------- Zing ---------- */
function sendZing(){
  const i = S.chat, now = Date.now();
  if ((S.cool[i] || 0) > now) return;
  if (S.today >= 30){ toast(t('daily_out')); return; }
  S.today++; S.sent++; S.cool[i] = now + 5000; S.lastMine[i] = now;
  addMsg(i, {t:'zing', from:'me'}); zingFx($('#chat')); updateZingBtn();
  if (now - (S.lastTheirs[i] || 0) < 3000){ addMsg(i, {t:'combo'}); setTimeout(() => showCombo(i), 450); return; }
  const f = F[i]; if (f.status === 'offline') return;
  if (Math.random() < f.back) setTimeout(() => incomingZing(i), 900 + Math.random() * 1500);
  else scheduleReply(i, 2000);
}
function incomingZing(i){
  const now = Date.now(), open = S.chat === i && !$('#chat').hidden;
  S.recv++; S.lastTheirs[i] = now;
  if (!open) S.zingedMe[i] = true;
  addMsg(i, {t:'zing', from:i}, true);
  zingFx(open ? $('#chat') : $('#phone'));
  if (!open) toast(t('zing_recv', {name:F[i].name}).replace(/~ /g, '').replace(/ ~/g, ''), i);
  if (now - (S.lastMine[i] || 0) < 3000){ addMsg(i, {t:'combo'}); setTimeout(() => showCombo(i), 450); }
  else if (open) toast(t('combo_hint'));
}
function showCombo(i){
  zingSound(); zingSound(.2); buzz([60,30,60,30,60,30,200]);
  overlay(`<div class="combo"><div class="combo-emos"><span class="ce left">${emoSVG(E('risata').s, 92)}</span><span class="ce right">${emoSVG(E('occhiolino').s, 92)}</span></div><h2>ZING<br>COMBO!</h2><p>${esc(t('combo_text', {name:F[i].name}))}</p><button class="btn-gloss pink" data-close-overlay>${t('combo_btn')}</button></div>`);
}

/* ---------- Grab it! ---------- */
function takeEmo(i, id){
  const e = E(id); if (S.owned[id]) return null;
  let extra = '';
  if (e.r !== 'comune'){
    const p = passesOf(i), period = t(e.r === 'leggendaria' ? 'month' : 'week');
    if (p[e.r] <= 0){ toast(t('passes_out', {name:F[i].name, r:rp(e.r), period})); return null; }
    p[e.r]--;
    extra = t('passes_left', {name:F[i].name, n:p[e.r], r:rp(e.r), period});
  }
  S.owned[id] = {from:F[i].name, date:'today'};
  return extra;
}
function grabMany(i, ids){
  const got = [], extras = [];
  for (const id of [...new Set(ids)]){ const x = takeEmo(i, id); if (x !== null){ got.push(id); if (x) extras.push(x); } }
  if (got.length){ popSound(); buzz(30); renderTray(); showCard(got, F[i].name, extras[extras.length - 1] || ''); }
  return got;
}
function showCard(ids, from, extra){
  const e = E(ids[0]), rest = ids.slice(1);
  overlay(`<div class="card-fig" style="--r:${RAR[e.r].c}"><span class="fig-tag">${t('new')}</span>${itemSVG(e, 120)}<h3>${esc(nm(e))}</h3><span class="rar-chip" style="--r:${RAR[e.r].c}">${rl(e.r)}${e.piece ? ' · ' + t('part') : ''}</span>${rest.length ? `${stripHTML(rest, 40)}<p class="small">${t('and_more', {n:rest.length})}</p>` : ''}<p>${t('from_line', {name:esc(from)})}</p>${extra ? `<p class="small">${esc(extra)}</p>` : ''}<button class="btn-gloss" data-close-overlay>${t('to_album')}</button></div>`);
}

/* ---------- Cotta segreta ---------- */
function openCrush(){
  const i = S.chat, f = F[i], has = S.crush.has(i), name = esc(f.name);
  sheet(`<h3>${t('crush_title')}</h3><p>${t('crush_text', {name})}</p><p class="small">${t('crush_used', {n:S.crush.size})}</p><button class="btn-gloss pink" data-crush-toggle>${has ? t('crush_remove') : t('crush_pick', {name})}</button><button class="btn-gloss" data-close-sheet>${t('not_now')}</button>`);
}
function toggleCrush(){
  const i = S.chat, f = F[i]; closeSheet();
  if (S.crush.has(i)){ S.crush.delete(i); toast(t('crush_removed')); renderChat(); return; }
  if (S.crush.size >= 3){ toast(t('crush_full')); return; }
  S.crush.add(i); renderChat();
  if (f.mutual && !S.matched[i]) setTimeout(() => showDestiny(i), 1400);
  else toast(t('crush_set'));
}
function showDestiny(i){
  S.matched[i] = true;
  const e = E('cometa'), fresh = !S.owned.cometa;
  if (fresh) S.owned.cometa = {from:'destiny', date:'today'};
  renderTray(); addMsg(i, {t:'sys', text:n2(STR.en.destiny_sys, STR.it.destiny_sys)});
  zingSound(); zingSound(.25); buzz([120,60,120,60,300]); shakeEl($('#phone'));
  overlay(`<div class="destiny"><div class="hearts" aria-hidden="true">&lt;3 &lt;3</div><h2>${t('destiny_title')}</h2><p>${esc(t('destiny_text', {name:F[i].name}))}</p>${fresh ? `<div class="gift">${emoSVG(e.s, 84)}<b>${esc(nm(e))}</b><span class="rar-chip" style="--r:${RAR[e.r].c}">${t('destiny_gift', {r:rl(e.r)})}</span></div>` : ''}<button class="btn-gloss pink" data-close-overlay>${t('destiny_btn')}</button></div>`);
}

/* ---------- Storie ---------- */
let storyTimer = null;
function openStory(i){
  const f = F[i], st = f.story, e = E(st.emo); S.seenStory[i] = true;
  overlay(`<div class="story-view" style="background:${st.bg}"><div class="sv-bar"><i></i></div><div class="sv-head"><span class="ava sm" style="--c:${f.c}">${initial(i)}</span><span style="min-width:0"><b>${esc(f.name)}</b><small>${t('story_meta')}</small></span><button class="sv-x" data-close-overlay aria-label="${t('close_story')}">&times;</button></div><p class="sv-text">${esc(tx(st.text))}</p><div class="sv-sticker">${emoSVG(e.s, 96)}<span>${esc(nm(e))}</span>${S.owned[e.id] ? `<em>${t('have')}</em>` : `<button class="grab" data-take-story="${i}">${t('grab')}</button>`}</div></div>`, 'story');
  storyTimer = setTimeout(closeOverlay, 7000);
  if (S.tab === 'amici') renderScreen();
}

/* ---------- Album: dettaglio ---------- */
function holders(e){ const base = {comune:41200, noncomune:8300, rara:940, epica:118, leggendaria:14}[e.r]; let h = 0; for (const c of e.id) h = (h * 31 + c.charCodeAt(0)) % 997; return Math.round(base * (.7 + h / 1660)); }
const fmt = n => n.toLocaleString(L === 'it' ? 'it-IT' : 'en-US');
function fromLabel(o){ return o.from === 'starter' ? t('starter') : o.from === 'destiny' ? (L === 'it' ? 'Zing del destino' : 'Destiny Zing') : o.from; }
function openEmo(id){
  const e = E(id), o = S.owned[id];
  const chip = `<span class="rar-chip" style="--r:${RAR[e.r].c}">${rl(e.r)}${e.piece ? ' · ' + t('part') : ''}${e.creator ? ' · ' + t('community') : ''}</span>`;
  if (!o){
    const show = e.r === 'comune' || e.r === 'noncomune';
    sheet(`<div class="center"><div class="silhouette">${itemSVG(e, 96)}</div><h3>${show ? esc(nm(e)) : '???'}</h3>${chip}<p>${t('missing_text')}</p><p class="small">${t('holders', {n:fmt(holders(e))})}</p></div><button class="btn-gloss" data-close-sheet>${t('ok')}</button>`);
    return;
  }
  const inV = S.vetrina.includes(id);
  const who = e.creator ? t('only_you') : t('holders_pass', {n:fmt(holders(e)), m:fmt(holders(e) * 3)});
  const date = o.date === 'oct' ? t('oct') : o.date === 'today' ? t('today') : o.date;
  sheet(`<div class="center">${itemSVG(e, 96)}<h3>${esc(nm(e))}</h3>${chip}${e.sc ? `<p class="small">${t('shortcut', {s:esc(e.sc)})}</p>` : ''}<p>${o.pz ? t('created_by_you') : t('received_from', {name:esc(fromLabel(o)), date})}</p><p class="small">${who}</p></div>${inV ? `<p class="small" style="text-align:center">${t('in_showcase')}</p>` : `<button class="btn-gloss pink" data-vetrina="${id}">${t('put_showcase')}</button>`}<button class="btn-gloss" data-close-sheet>${t('close')}</button>`);
}

/* ---------- Studio ---------- */
function submitEmo(){
  const name = S.studioName.trim();
  if (!name){ toast(t('need_name')); $('#emoName') && $('#emoName').focus(); return; }
  const c = {id:'u' + Date.now(), name, spec:{...S.studio}, ok:false};
  S.creations.unshift(c); S.studioName = ''; renderScreen();
  toast(t('sent_review'));
  setTimeout(() => {
    c.ok = true;
    CAT.push({id:c.id, name:c.name, r:'noncomune', s:c.spec, creator:true});
    S.owned[c.id] = {from:'me', date:'today', pz:true}; renderTray(); popSound();
    toast(t('approved_toast', {name:c.name}));
    if (S.tab === 'studio' || S.tab === 'album') renderScreen();
  }, 3500);
}

/* ---------- Overlay, sheet, toast ---------- */
function overlay(html, cls = ''){ clearTimeout(storyTimer); const o = $('#overlay'); o.className = 'overlay ' + cls; o.innerHTML = html; o.hidden = false; const b = o.querySelector('button'); b && b.focus({preventScroll:true}); }
function closeOverlay(){ clearTimeout(storyTimer); $('#overlay').hidden = true; $('#overlay').innerHTML = ''; if ($('#chat').hidden) renderScreen(); }
function sheet(html){ $('#sheet').innerHTML = html; $('#sheetWrap').hidden = false; }
function closeSheet(){ $('#sheetWrap').hidden = true; }
let toastT = null;
function toast(text, open){
  const el = $('#toast'); el.textContent = text; el.dataset.toastOpen = open || ''; el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2800);
}

/* ---------- Eventi ---------- */
document.addEventListener('click', ev => {
  if (ev.target === $('#overlay')){ closeOverlay(); return; }
  if (ev.target === $('#sheetWrap')){ closeSheet(); return; }
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.lang){ L = d.lang; try { localStorage.setItem('zing-lang', L); } catch(e){} renderStatic(); renderAll(); }
  else if (d.tab){ S.tab = d.tab; if (!$('#chat').hidden){ $('#chat').hidden = true; S.chat = null; } renderAll(); $('#screens').scrollTop = 0; }
  else if (d.open) openChat(d.open);
  else if ('closeChat' in d) closeChat();
  else if ('zing' in d) sendZing();
  else if ('tray' in d){ $('#tray').hidden = !$('#tray').hidden; }
  else if (d.addMix){ if (S.mix.length < 12){ S.mix.push(d.addMix); clickSound(); renderMix(); } }
  else if (d.mixRemove !== undefined){ S.mix.splice(+d.mixRemove, 1); renderMix(); }
  else if ('mixClear' in d){ S.mix = []; renderMix(); }
  else if (d.take !== undefined){
    const m = S.chats[S.chat][+d.take], got = grabMany(S.chat, m.strip);
    if (got.length){ m.taken = true; renderMessages(); }
  }
  else if (d.takeStory){ grabMany(d.takeStory, [F[d.takeStory].story.emo]); }
  else if ('crush' in d) openCrush();
  else if ('crushToggle' in d) toggleCrush();
  else if (d.story) openStory(d.story);
  else if (d.emo) openEmo(d.emo);
  else if (d.vetrina){ S.vetrina = [d.vetrina, ...S.vetrina.filter(x => x !== d.vetrina)].slice(0, 3); closeSheet(); toast(t('showcased')); if (S.tab === 'profilo') renderScreen(); }
  else if (d.opt){ S.studio[d.opt] = d.val; renderScreen(); }
  else if ('submitEmo' in d) submitEmo();
  else if (d.notify){
    const i = d.notify; if (S.notify[i]) return;
    S.notify[i] = true; renderScreen(); toast(t('notify_set', {name:F[i].name}));
    setTimeout(() => { F[i].status = 'online'; S.notify[i] = false; onlineSound(); buzz(40); toast(t('is_online', {name:F[i].name}), i); renderAll(); }, 6000);
  }
  else if ('closeOverlay' in d) closeOverlay();
  else if ('closeSheet' in d) closeSheet();
  else if ('sim' in d) incomingZing('sara');
  else if (b.id === 'toast'){ b.hidden = true; if (d.toastOpen) openChat(d.toastOpen); }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!$('#overlay').hidden) closeOverlay(); else if (!$('#sheetWrap').hidden) closeSheet();
});
$('#composer').addEventListener('submit', ev => { ev.preventDefault(); const inp = $('#msgInput'); sendMessage(inp.value); inp.value = ''; });
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'emoName') S.studioName = el.value;
  else if (el.id === 'nickInput'){ S.nick = el.value || '~*Simo*~'; renderMe(); }
  else if (el.id === 'pmInput'){ S.pm = el.value; S.pmEdited = true; }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'status') S.status = el.value;
  else if (el.id === 'quiet') S.quiet = el.checked;
});

$('#trayBtn').innerHTML = emoSVG(E('sorriso').s, 26, false);
renderStatic(); renderMe(); renderAll();
})();
</script>
