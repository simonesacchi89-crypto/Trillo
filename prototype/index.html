<title>Zing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600;700;800&family=VT323&display=swap">
<style>
/* Layout: telefono al centro su cielo Y2K, guida accanto su desktop e sotto su telefono. Un solo look chiaro; i profili hanno temi propri, come su MySpace. */
:root{
  --sky-top:#4cb6ff; --sky-mid:#a6e0ff; --sky-low:#eaf8ff;
  --aqua:#1a96e6; --aqua-deep:#0f6fbf; --ink:#13304f; --muted:#56739a;
  --paper:#ffffff; --panel:#f3f8fc; --line:#d3e5f3; --pink:#ff4f9a; --pink-deep:#c21f6a;
  --lime:#7fdc2f; --lime-deep:#4fa816; --sun:#ffc62e; --cream:#fff6d1; --on:#fff; --night:#13304f;
  --bar:linear-gradient(180deg, #5cc2ff 0%, #1a96e6 60%, #0f6fbf 100%); --bar-gloss:linear-gradient(180deg, rgb(255 255 255 / .35), rgb(255 255 255 / .03));
  --bar-ink:#fff; --bar-ink-inv:#0f6fbf; --soft:#e6f3fd; --mine:linear-gradient(180deg, #effde2, #d3f5b0); --mine-line:#b5e08a;
  --bubble-gloss:linear-gradient(180deg, rgb(255 255 255 / .7), rgb(255 255 255 / 0)); --btn:linear-gradient(180deg, #6cc8ff 0%, #1a96e6 60%, #0f6fbf 100%); --btn-shadow:#0b4f8a; --rb:16px;
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --font-pixel:"VT323",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--font-body); font-size:14.5px; line-height:1.4;
  background:
    radial-gradient(circle at 10% 16%, rgb(255 255 255 / .8) 0 56px, transparent 57px),
    radial-gradient(circle at 18% 22%, rgb(255 255 255 / .55) 0 28px, transparent 29px),
    radial-gradient(circle at 88% 10%, rgb(255 255 255 / .6) 0 90px, transparent 91px),
    radial-gradient(circle at 80% 86%, rgb(255 255 255 / .5) 0 130px, transparent 131px),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  background-color:var(--sky-mid);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink); outline-offset:2px}
svg{overflow:visible}

.stage{display:grid; grid-template-columns:minmax(0,390px) minmax(0,340px); gap:40px; justify-content:center; align-items:start; max-width:820px; margin:0 auto}
@media (max-width:800px){ .stage{grid-template-columns:minmax(0,420px); gap:24px} }

/* ---------- Telefono ---------- */
.phone{
  position:relative; display:flex; flex-direction:column; overflow:hidden;
  height:min(800px, calc(100dvh - 48px)); min-height:600px;
  background:var(--paper); color:var(--ink); font-family:var(--font-body); border-radius:30px; border:3px solid var(--paper);
  box-shadow:0 0 0 1.5px var(--aqua), 0 24px 50px rgb(19 48 79 / .3);
}
.topbar{
  position:relative; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center;
  padding:12px 14px 10px; color:var(--bar-ink);
  background:var(--bar);
}
.topbar::after{content:""; position:absolute; inset:0 0 55% 0; background:var(--bar-gloss); pointer-events:none}
.topbar > *{position:relative; z-index:1}
.me-nick{font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.me-row{display:flex; gap:6px; align-items:center; min-width:0}
.status-select{appearance:none; border:1px solid color-mix(in srgb, var(--bar-ink) 50%, transparent); background:color-mix(in srgb, var(--bar-ink) 15%, transparent); color:var(--bar-ink); border-radius:999px; padding:0 9px; font-size:11.5px; font-weight:700; max-width:118px}
.status-select option{color:var(--ink)}
.pm{width:100%; border:0; border-bottom:1px dashed transparent; background:transparent; color:var(--bar-ink); font-size:12px; padding:2px 0; font-style:italic}
.pm::placeholder{color:color-mix(in srgb, var(--bar-ink) 70%, transparent)}
.pm:focus{outline:none; border-bottom-color:rgb(255 255 255 / .8)}
.brand{display:grid; justify-items:end; gap:5px}
.logo{font-family:var(--font-display); font-weight:700; font-size:17px; line-height:1; letter-spacing:-.02em; color:var(--bar-ink)}
.lang{display:flex; border-radius:999px; border:1px solid color-mix(in srgb, var(--bar-ink) 50%, transparent); overflow:hidden}
.lang button{border:0; background:transparent; color:var(--bar-ink); font-size:10.5px; font-weight:800; padding:1px 7px}
.lang button.on{background:var(--bar-ink); color:var(--bar-ink-inv)}

.ava{
  --c:var(--aqua); flex:none; position:relative; width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--on);
  background:radial-gradient(circle at 34% 26%, rgb(255 255 255 / .7) 0 14%, transparent 32%), var(--c);
  box-shadow:inset 0 -3px 6px rgb(0 0 0 / .16), 0 0 0 2px var(--paper);
  text-shadow:0 1px 2px rgb(0 0 0 / .25);
}
.ava.sm{width:34px; height:34px; font-size:13px}
.ava.xl{width:80px; height:80px; font-size:28px; box-shadow:inset 0 -5px 10px rgb(0 0 0 / .16), 0 0 0 4px var(--paper)}
.dot{position:absolute; right:-2px; bottom:-2px; width:13px; height:13px; border-radius:50%; background:var(--s); border:2.5px solid var(--paper)}

.screens{flex:1; overflow-y:auto; background:var(--panel); overscroll-behavior:contain}
.tabs{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); background:var(--paper); padding:5px 6px 7px}
.tab{position:relative; display:grid; justify-items:center; gap:1px; padding:5px 0; border:0; background:transparent; border-radius:12px; font-size:11px; font-weight:700; color:var(--muted)}
.tab svg{width:21px; height:21px}
.tab.on{color:var(--aqua-deep); background:var(--soft)}
.tab .badge{position:absolute; top:1px; right:22%}

/* ---------- Skin: cambiano colori, font e decorazioni, mai la posizione dei comandi ---------- */
.phone[data-skin="classic"]{
  --bar:linear-gradient(180deg, #7fb2f0 0%, #3b78d8 48%, #2459b8 52%, #3b78d8 100%); --bar-gloss:linear-gradient(180deg, rgb(255 255 255 / .55), rgb(255 255 255 / .1));
  --panel:#eaf1fb; --line:#a9c0df; --soft:#dbe7f8; --mine:linear-gradient(180deg, #ffffff, #eef4ff); --mine-line:#a9c0df;
  --btn:linear-gradient(180deg, #a6e07a 0%, #5bb52a 55%, #3d8a12 100%); --btn-shadow:#2f6d0b; --rb:5px; --aqua-deep:#1f4fae;
  --font-display:"Trebuchet MS","Verdana",sans-serif; --font-body:"Verdana","Tahoma","Segoe UI",sans-serif;
  font-size:13px; border-radius:12px;
}
.phone[data-skin="classic"] .logo{font-style:italic; letter-spacing:0}
.phone[data-skin="classic"] .msgs{background:linear-gradient(180deg, #f4f8ff, #e3ecf9)}
.phone[data-skin="classic"] .ava{border-radius:6px}
.phone[data-skin="chrome"]{
  --paper:#161a2c; --panel:#0c0f1d; --ink:#e9edff; --muted:#9aa5c9; --line:#2a3156; --soft:#222a4a; --cream:#2b2440;
  --bar:linear-gradient(180deg, #f4f6fa 0%, #b9c2d2 42%, #6c7891 52%, #d5dbe6 100%); --bar-gloss:none; --bar-ink:#0c0f1d; --bar-ink-inv:#f4f6fa;
  --mine:linear-gradient(180deg, #ff6fb5, #b8185f); --mine-line:#ff8cc6; --bubble-gloss:linear-gradient(180deg, rgb(255 255 255 / .2), rgb(255 255 255 / 0));
  --btn:linear-gradient(180deg, #8ad8ff 0%, #2b84ff 60%, #1452b8 100%); --btn-shadow:#0a2a66; --aqua-deep:#7fd0ff; --rb:14px;
  color-scheme:dark; box-shadow:0 0 0 1.5px #7fd0ff, 0 0 40px rgb(127 208 255 / .35), 0 24px 50px rgb(0 0 0 / .45);
}
.phone[data-skin="chrome"] .msgs{background:radial-gradient(rgb(127 208 255 / .18) 1px, transparent 1.4px) 0 0 / 18px 18px, var(--panel)}
.phone[data-skin="chrome"] .logo{background:linear-gradient(180deg, #1a1e33, #4a5577); -webkit-background-clip:text; background-clip:text; color:transparent}
.phone[data-skin="clean"]{
  --bar:var(--paper); --bar-gloss:none; --bar-ink:var(--ink); --bar-ink-inv:var(--paper); --panel:#f6f7f9; --line:#e5e8ee; --soft:#eef1f5;
  --mine:#e8f2ff; --mine-line:#d3e4fa; --bubble-gloss:none; --btn:#13304f; --btn-shadow:transparent; --rb:18px; --font-display:"Figtree",system-ui,sans-serif;
  box-shadow:0 0 0 1px #d5dbe5, 0 24px 50px rgb(19 48 79 / .18);
}
.phone[data-skin="clean"] .topbar, .phone[data-skin="clean"] .chat-head, .phone[data-skin="clean"] .prof-head{border-bottom:1px solid var(--line)}
.phone[data-skin="clean"] .msgs{background:var(--panel)}
.phone[data-skin="clean"] .grab{background:var(--sun); box-shadow:none}
.skins{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.skin-btn{border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:700; color:var(--ink)}
.skin-btn.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.skin-card{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:center; text-align:left; width:100%; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:14px; padding:8px 10px; margin-top:6px}
.skin-card.on{border:2px solid var(--pink)}
.skin-card small{display:block; color:var(--muted); font-size:11.5px; font-weight:400}
.skin-swatch{width:44px; height:44px; border-radius:10px; border:1px solid var(--line)}

/* ---------- Drops ---------- */
.drops-note{margin:10px 16px 0; padding:9px 12px; border-radius:14px; background:var(--soft); font-size:12px; color:var(--muted)}
.drop{margin:10px 16px 0; border-radius:18px; background:var(--paper); border:1px solid var(--line); overflow:hidden}
.drop-img{position:relative; aspect-ratio:16/9; max-width:100%; display:grid; place-items:center}
.drop-tag{position:absolute; left:10px; top:10px; background:rgb(0 0 0 / .55); color:#fff; font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; padding:3px 8px; border-radius:999px}
.drop-tag.live{background:#ff2d55}
.drop-tag.live::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:#fff; margin-right:5px; vertical-align:1px; animation:sync-pulse .9s infinite}
.drop-body{padding:10px 12px 12px; display:grid; gap:6px}
.shop-row{display:flex; align-items:center; gap:8px; border:0; background:transparent; padding:0; text-align:left; color:var(--ink); font-weight:700; font-size:13px}
.shop-logo{width:24px; height:24px; border-radius:7px; display:grid; place-items:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:11px; background:var(--c)}
.verified{font-size:10px; font-weight:800; color:var(--aqua-deep); background:var(--soft); padding:1px 7px; border-radius:999px}
.drop-title{font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:-.01em; margin:0}
.drop-meta{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.drop-meta b{color:var(--ink); font-size:14px}
.stock{height:6px; border-radius:999px; background:var(--soft); overflow:hidden}
.stock i{display:block; height:100%; background:linear-gradient(90deg, var(--pink), var(--sun))}
.excl{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.drop .btn{margin-top:2px}
.countdown{font-variant-numeric:tabular-nums; font-weight:800; color:#ff2d55}
.b2b{margin:14px 16px 16px; padding:12px 14px; border-radius:16px; border:1px dashed var(--line); background:var(--paper); font-size:13px}
.b2b h3{font-size:14px; margin-bottom:4px}
.checkout-row{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; border-bottom:1px solid var(--line)}
.pay-note{font-size:11.5px; color:var(--muted)}

/* ---------- Amici ---------- */
.stories{display:flex; gap:12px; overflow-x:auto; padding:12px 14px 10px; background:var(--paper); border-bottom:1px solid var(--line)}
.story{display:grid; justify-items:center; gap:4px; border:0; background:transparent; padding:0; width:58px; flex:none}
.ring{padding:2.5px; border-radius:50%; background:conic-gradient(var(--pink), var(--sun), var(--lime), var(--aqua), var(--pink))}
.story.seen .ring{background:var(--line)}
.story .ava{width:48px; height:48px; font-size:17px}
.story-name{font-size:11px; font-weight:600; max-width:58px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.group{font-family:var(--font-pixel); font-size:17px; color:var(--muted); padding:10px 16px 2px; letter-spacing:.4px}
.friend{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:0; padding:0 10px 0 10px}
.f-ava{border:0; background:transparent; padding:6px; border-radius:50%}
.friend-main{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; text-align:left; border:0; background:transparent; padding:8px 6px; border-radius:14px; min-width:0}
.friend-main:hover, .f-ava:hover{background:rgb(26 150 230 / .07)}
.f-text{min-width:0}
.f-text > span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.f-name{font-weight:800}
.f-pm{font-size:12px; color:var(--muted); font-style:italic}
.f-listen{font-size:11px; color:var(--aqua-deep)}
.f-listen::before{content:"\266B  "}
.badge{display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 6px; border-radius:999px; background:var(--pink); color:var(--on); font-size:10.5px; font-weight:800}
.badge.zing{background:var(--sun); color:var(--ink); animation:wiggle 1.2s infinite}
.bell{border:1px dashed var(--aqua); background:var(--paper); color:var(--aqua-deep); border-radius:999px; font-size:11px; font-weight:800; padding:3px 9px; white-space:nowrap}
.bell.on{border-style:solid; background:var(--soft)}

/* ---------- Chat ---------- */
.chat{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; background:var(--panel)}
.chat-head, .prof-head{position:relative; display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:9px; align-items:center; padding:10px 12px 9px; color:var(--bar-ink); background:var(--bar)}
.chat-head::after, .prof-head::after{content:""; position:absolute; inset:0 0 55% 0; background:var(--bar-gloss); pointer-events:none}
.chat-head > *, .prof-head > *{position:relative; z-index:1}
.ch-ava{border:0; background:transparent; padding:0; border-radius:50%}
.ch-info{min-width:0; border:0; background:transparent; color:var(--bar-ink); text-align:left; padding:2px 4px; border-radius:10px}
.ch-info:hover{background:color-mix(in srgb, var(--bar-ink) 12%, transparent)}
.ch-info b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ch-info small{display:block; font-size:11.5px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon-btn{display:grid; place-items:center; width:36px; height:36px; border-radius:50%; border:1px solid color-mix(in srgb, var(--bar-ink) 50%, transparent); background:color-mix(in srgb, var(--bar-ink) 14%, transparent); color:var(--bar-ink); padding:0}
.icon-btn svg{width:18px; height:18px}
.icon-btn.heart.on{background:var(--pink); border-color:var(--pink); color:#fff}
.msgs{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:12px; background:radial-gradient(var(--line) 1px, transparent 1.4px) 0 0 / 18px 18px, var(--panel)}
.msg{display:flex}
.msg.mine{justify-content:flex-end}
.bubble{position:relative; max-width:82%; padding:7px 11px; border-radius:var(--rb); background:var(--paper); border:1px solid var(--line); display:grid; gap:4px; justify-items:start; min-width:0}
.bubble::before{content:""; position:absolute; inset:2px 8px auto 8px; height:40%; border-radius:12px; background:var(--bubble-gloss); pointer-events:none}
.msg.mine .bubble{background:var(--mine); border-color:var(--mine-line); border-bottom-right-radius:5px; justify-items:end}
.msg.theirs .bubble{border-bottom-left-radius:5px}
.bubble p{margin:0; position:relative; overflow-wrap:anywhere}
.emo-inline svg{vertical-align:-5px}
.strip{position:relative; display:flex; align-items:flex-end; max-width:100%; overflow-x:auto; padding-top:6px}
.strip > *{flex:none}
.strip .p-bug + .p-bug{margin-left:-12px}
.strip .emo + .emo{margin-left:-2px}
.strip.single{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.emo-name{font-size:11px; font-weight:700; color:var(--muted)}
.grab{border:0; border-radius:999px; padding:5px 14px; font-size:13px; font-weight:800; color:var(--ink); background:linear-gradient(180deg, #fff2a8 0%, var(--sun) 55%, #f2a400 100%); box-shadow:inset 0 1px 1px rgb(255 255 255 / .7), 0 2px 0 #c98700}
.took{font-size:11.5px; font-weight:800; color:var(--lime-deep)}
.took.muted{color:var(--muted)}
.rar-chip{--r:var(--muted); display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--on); background:var(--r); padding:2px 8px; border-radius:999px}
.sys{align-self:center; max-width:90%; text-align:center; font-size:12px; font-weight:600; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px 11px}
.zing-pill{font-family:var(--font-pixel); font-size:17px; color:var(--ink); background:var(--cream); border:1.5px dashed var(--sun)}
.combo-pill{color:var(--on); background:var(--night); border:0; font-weight:800; letter-spacing:.4px}
.typing{min-height:18px; padding:0 14px; font-size:11.5px; font-style:italic; color:var(--muted)}
.suggest{display:flex; gap:6px; overflow-x:auto; padding:6px 10px; background:var(--paper); border-top:1px solid var(--line)}
.sug{flex:none; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:3px 10px 3px 4px}
.sug.locked{border-style:dashed; color:var(--muted); font-size:12px; white-space:nowrap}
.sug code, .sc-row code{font-family:var(--font-pixel); font-size:15px; color:var(--ink)}
.emo-inline.seq{display:inline-flex; align-items:flex-end; vertical-align:-6px}
.emo-inline.seq .p-bug + .p-bug{margin-left:-7px}
.sc-list{display:grid; gap:2px}
.sc-row{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:4px 2px; border-bottom:1px solid var(--line); font-size:13px}
.sc-row.locked{opacity:.5}
.sc-row .codes{display:flex; gap:6px}
.sc-row code{background:var(--cream); padding:0 6px; border-radius:6px}
.mixbar{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:5px 10px; background:var(--cream); border-top:1px solid var(--line)}
.mixbar .strip{padding-top:4px}
.mixbar .strip button{border:0; background:transparent; padding:0}
.mix-clear{border:1px solid var(--sun); background:var(--paper); border-radius:999px; font-size:11.5px; font-weight:800; padding:3px 10px}
.tray{background:var(--paper); border-top:1px solid var(--line); max-height:180px; overflow-y:auto; padding:6px 10px 8px}
.tray-hint{font-size:11.5px; color:var(--muted); margin:0 0 4px}
.tray-label{font-family:var(--font-pixel); font-size:15px; color:var(--muted); margin:4px 0 2px}
.tray-grid{display:flex; flex-wrap:wrap; gap:2px}
.tray-grid button{border:1px solid transparent; background:transparent; border-radius:10px; padding:3px}
.tray-grid button:hover{background:var(--panel); border-color:var(--line)}
.composer{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:6px; align-items:center; padding:8px 10px 4px; background:var(--paper); border-top:1px solid var(--line)}
.composer .icon-btn{border-color:var(--line); background:var(--panel); color:var(--aqua-deep)}
.composer input{min-width:0; border:1px solid var(--line); border-radius:999px; padding:8px 13px; background:var(--panel)}
.composer input:focus{outline:none; border-color:var(--aqua)}
.zing-btn{position:relative; display:grid; place-items:center; width:40px; height:40px; border-radius:50%; border:0; padding:0; color:var(--on); font-weight:800; font-size:12px; background:linear-gradient(180deg, #ff9ccb 0%, var(--pink) 55%, var(--pink-deep) 100%); box-shadow:inset 0 1px 1px rgb(255 255 255 / .6), 0 2px 0 #8e0f4b}
.zing-btn svg{width:20px; height:20px}
.zing-btn:disabled{filter:grayscale(.75); opacity:.7; cursor:default}
.chat-foot{padding:2px 14px 8px; background:var(--paper); font-family:var(--font-pixel); font-size:14.5px; color:var(--muted)}

/* ---------- Album, Studio ---------- */
.pad{padding:16px}
h2{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-.01em; margin:0; color:var(--ink); text-wrap:balance}
h3{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:-.01em; margin:0; color:var(--ink); text-wrap:balance}
.small{font-size:12px; color:var(--muted); margin:4px 0 0}
.back-link{border:0; background:transparent; color:var(--aqua-deep); font-weight:700; font-size:13px; padding:0; margin-bottom:8px}
.coll-head{display:flex; justify-content:space-between; align-items:flex-end; gap:10px}
.link-btn{border:0; background:transparent; color:var(--aqua-deep); font-weight:700; font-size:12.5px; padding:0}
.rdot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--r); margin-right:6px; vertical-align:1px}
.coll-row{display:flex; gap:4px; align-items:center; overflow:hidden}
.rar-sec{padding:4px 16px 10px}
.rar-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:12px; font-weight:700; color:var(--muted)}
.emo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(66px,1fr)); gap:6px}
.tile{display:grid; justify-items:center; gap:2px; padding:7px 4px 5px; border-radius:14px; border:1px solid var(--line); background:var(--paper); font-size:10.5px; font-weight:700; color:var(--ink); min-width:0}
.tile span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile:hover{border-color:var(--aqua)}
.tile.missing{background:transparent; border-color:transparent; color:var(--muted)}
.tile.missing svg, .silhouette svg{filter:grayscale(1); opacity:.18}
.tile.missing svg *, .silhouette svg *{animation:none !important}

.studio-hero{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center; margin-bottom:6px}
.preview{display:grid; place-items:center; width:104px; height:104px; border-radius:22px; background:radial-gradient(circle at 50% 40%, var(--paper), var(--soft)); border:1px solid var(--line)}
.opt{margin-top:10px}
.opt-label{display:block; font-family:var(--font-pixel); font-size:16px; color:var(--muted); margin:12px 0 5px; letter-spacing:.3px}
.opt .opt-label{margin-top:0}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{display:grid; place-items:center; min-width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--paper); padding:0 8px; font-size:12px; font-weight:700}
.chip.on{border:2px solid var(--pink); background:color-mix(in srgb, var(--pink) 10%, var(--paper))}
.sw{width:22px; height:22px; border-radius:50%; box-shadow:inset 0 -3px 5px rgb(0 0 0 / .2), inset 0 3px 3px rgb(255 255 255 / .6)}
.field{width:100%; border:1px solid var(--line); border-radius:12px; padding:9px 11px; background:var(--paper)}
.field:focus{outline:none; border-color:var(--aqua)}
textarea.field{resize:vertical; min-height:64px}
.btn{display:block; width:100%; margin-top:10px; border:0; border-radius:999px; padding:10px 16px; font-weight:800; font-size:14px; color:var(--on); background:var(--btn); box-shadow:inset 0 1px 1px rgb(255 255 255 / .4), 0 2px 0 var(--btn-shadow)}
.btn.pink{background:linear-gradient(180deg, #ff9ccb 0%, var(--pink) 55%, var(--pink-deep) 100%); box-shadow:inset 0 1px 1px rgb(255 255 255 / .55), 0 2px 0 #8e0f4b}
.btn.ghost{background:var(--paper); color:var(--aqua-deep); border:1px solid var(--line); box-shadow:none}
.creations{display:grid; gap:8px; margin-top:14px}
.creation{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 12px; border-radius:14px; background:var(--paper); border:1px solid var(--line)}
.state{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--cream); color:var(--ink)}
.state.ok{background:var(--lime); color:var(--ink)}

/* ---------- Profilo / bacheca stile MySpace ---------- */
.prof{position:absolute; inset:0; z-index:7; display:flex; flex-direction:column; background:var(--panel)}
.prof-head{grid-template-columns:auto minmax(0,1fr) auto}
.prof-head b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.prof-scroll{flex:1; overflow-y:auto}
.theme-sky{--cover:linear-gradient(135deg,#7fd0ff,#1a96e6 60%,#0f6fbf); --accent:#1a96e6}
.theme-bubblegum{--cover:linear-gradient(135deg,#ffc2dc,#ff4f9a 60%,#c21f6a); --accent:#e8387f}
.theme-midnight{--cover:radial-gradient(circle, #fff 0 1px, transparent 1.6px) 0 0 / 20px 20px, linear-gradient(135deg,#2b2f7a,#3a2a6a 55%,#120c24); --accent:#6a4cff}
.theme-lime{--cover:linear-gradient(135deg,#e2ff9e,#7fdc2f 60%,#3d8a12); --accent:#3d8a12}
.theme-chrome{--cover:linear-gradient(120deg,#f4f7fb,#aeb9c8 30%,#f1f4f8 52%,#8794a6 80%,#dfe5ec); --accent:#4b5b70}
.cover{height:96px; background:var(--cover)}
.prof-id{display:grid; justify-items:center; text-align:center; gap:3px; margin-top:-42px; padding:0 16px}
.prof-id .name{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.01em; margin-top:6px}
.prof-id .pm{color:var(--muted); font-size:12.5px; font-style:italic; padding:0; border:0}
.meta{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:6px}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--paper); border:1px solid var(--line)}
.eq{display:inline-flex; gap:2px; align-items:flex-end; height:10px}
.eq i{width:2.5px; background:var(--accent); border-radius:1px; animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s} .eq i:nth-child(3){animation-delay:-.6s}
.tags{display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-top:8px}
.tag{font-size:11px; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--paper)); padding:2px 9px; border-radius:999px}
.prof-actions{display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:8px; padding:12px 16px 4px}
.prof-actions .btn{margin-top:0; background:var(--accent); box-shadow:none}
.prof-actions .btn.ghost{background:var(--paper); color:var(--accent)}
.sec{padding:10px 16px}
.sec-title{display:flex; justify-content:space-between; align-items:baseline; margin:4px 0 8px}
.sec-title h3{font-size:14px}
.sec-title span{font-family:var(--font-pixel); font-size:15px; color:var(--muted)}
.vetrina{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.post{border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow:hidden; margin-bottom:10px}
.photo{position:relative; aspect-ratio:4/3; max-width:100%; background:var(--line)}
.photo img{display:block; width:100%; height:100%; object-fit:cover}
.photo .sticker{position:absolute; right:10px; bottom:8px}
.scene-sunset{background:radial-gradient(circle at 50% 64%, #fff3b0 0 10%, transparent 10.5%), linear-gradient(180deg,#ffb36b 0%,#ff6f91 58%,#6a3d9a 100%)}
.scene-city{background:radial-gradient(circle at 78% 22%, #fff6d1 0 5%, transparent 5.5%), repeating-linear-gradient(90deg, transparent 0 14px, rgb(255 214 120 / .55) 14px 17px, transparent 17px 30px) 0 72% / 100% 10% no-repeat, linear-gradient(180deg, transparent 60%, #12152e 60%), linear-gradient(180deg,#2b2f7a,#ff6fb5)}
.scene-sea{background:radial-gradient(circle at 30% 38%, #fff6d1 0 8%, transparent 8.5%), linear-gradient(180deg,#9ad8ff 0 54%,#1a96e6 54% 100%)}
.scene-concert{background:radial-gradient(ellipse at 22% 0, rgb(255 79 154 / .8), transparent 48%), radial-gradient(ellipse at 78% 0, rgb(26 150 230 / .8), transparent 48%), radial-gradient(circle at 15% 100%, #0b0716 0 9%, transparent 9.5%), radial-gradient(circle at 38% 100%, #0b0716 0 11%, transparent 11.5%), radial-gradient(circle at 62% 100%, #0b0716 0 10%, transparent 10.5%), radial-gradient(circle at 85% 100%, #0b0716 0 12%, transparent 12.5%), #1a1030}
.scene-skate{background:radial-gradient(ellipse at 20% 100%, #aeb6c4 0 38%, transparent 38.5%), linear-gradient(180deg,#9ad8ff 0 62%,#cfd5df 62% 100%)}
.scene-room{background:radial-gradient(circle at 75% 30%, #ffe96b 0 7%, transparent 7.5%), linear-gradient(180deg,#ffe0f0 0 70%,#d9b38c 70%)}
.post-body{padding:10px 12px 8px; display:grid; gap:4px}
.post-body h4{margin:0; font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:-.01em}
.post-body p{margin:0; overflow-wrap:anywhere}
.post-meta{font-size:11px; color:var(--muted)}
.reacts{display:flex; flex-wrap:wrap; gap:5px; padding:0 12px 10px; align-items:center}
.react{display:inline-flex; align-items:center; gap:3px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:2px 8px 2px 4px; font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums}
.react.on{border-color:var(--accent, var(--aqua)); background:color-mix(in srgb, var(--accent, var(--aqua)) 12%, var(--paper))}
.react.add{padding:2px 9px; color:var(--muted)}
.react.link{border:0; background:transparent; color:var(--muted); padding:2px 4px; margin-left:auto}
.comments{border-top:1px solid var(--line); padding:8px 12px 10px; display:grid; gap:6px; background:var(--panel)}
.comment{font-size:13px}
.comment b{margin-right:4px}
.cform{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px}
.cform input{min-width:0; border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--paper); font-size:13px}
.cform button{border:0; border-radius:999px; padding:6px 12px; background:var(--accent, var(--aqua)); color:var(--on); font-weight:800; font-size:12.5px}
.composer-card{border-radius:16px; background:var(--paper); border:1px dashed var(--line); padding:10px 12px; margin-bottom:10px; display:grid; gap:8px}
.seg{display:flex; gap:4px}
.seg button{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 12px; font-size:12.5px; font-weight:700}
.seg button.on{background:var(--pink); color:var(--on); border-color:var(--pink)}
.scenes{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.scene-btn{width:44px; height:33px; border-radius:8px; border:2px solid transparent; padding:0}
.scene-btn.on{border-color:var(--pink)}
.upload{position:relative; font-size:12px; font-weight:700; color:var(--aqua-deep); border:1px solid var(--line); border-radius:999px; padding:5px 10px; background:var(--paper); cursor:pointer}
.upload input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer}
.draft-photo{border-radius:10px; overflow:hidden; max-width:100%}
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:6px}
.stat{padding:9px 12px; border-radius:14px; background:var(--paper); border:1px solid var(--line)}
.stat b{display:block; font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--pink); font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px; font-weight:600; color:var(--muted)}
.settings{display:grid; gap:6px}
.setting{display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 10px; align-items:start; padding:9px 12px; border-radius:14px; background:var(--paper); border:1px solid var(--line); font-weight:600}
.setting small{grid-column:2; font-weight:400; color:var(--muted); font-size:11.5px}
.setting input[type=checkbox]{margin-top:3px; accent-color:var(--pink)}
.theme-row{display:flex; gap:8px; flex-wrap:wrap}
.theme-btn{width:52px; height:36px; border-radius:10px; border:2px solid transparent; background:var(--cover); padding:0}
.theme-btn.on{border-color:var(--ink)}

/* ---------- Overlay, sheet, toast ---------- */
.overlay{position:absolute; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:rgb(19 48 79 / .55); backdrop-filter:blur(3px)}
.overlay.story{padding:0; background:var(--ink)}
.overlay.calm{background:rgb(10 20 40 / .74); backdrop-filter:blur(8px)}
.card-fig{--r:var(--aqua); width:min(240px,100%); display:grid; justify-items:center; gap:6px; padding:18px 16px 16px; text-align:center; border-radius:20px; background:var(--paper); border-top:4px solid var(--r); box-shadow:0 16px 36px rgb(0 0 0 / .3); animation:up .35s ease-out}
.card-fig p{margin:0; font-size:12.5px}
.card-fig .strip{justify-content:center}
.card-fig .btn{margin-top:6px}
.fig-tag{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted)}
.sync{display:grid; justify-items:center; gap:10px; text-align:center; color:var(--on)}
.sync-avas{display:flex; align-items:center}
.sync-avas .ava{box-shadow:0 0 0 3px rgb(255 255 255 / .9), 0 0 30px rgb(255 79 154 / .5); animation:sync-pulse 1.6s ease-in-out infinite}
.sync-avas .ava + .ava{margin-left:-18px}
.sync h2{font-size:24px; color:var(--on)}
.sync p{margin:0; max-width:26ch; font-size:13.5px; opacity:.85}
.sync-btn{margin-top:4px; border:1px solid rgb(255 255 255 / .7); background:transparent; color:var(--on); border-radius:999px; padding:7px 22px; font-weight:800}
.gift{display:grid; justify-items:center; gap:4px; padding:10px 16px; border-radius:18px; background:rgb(255 255 255 / .1); border:1px solid rgb(255 255 255 / .3)}
.story-view{position:relative; width:100%; height:100%; display:grid; grid-template-rows:auto auto 1fr auto; padding:12px 16px 26px; color:var(--on)}
.sv-bar{height:3px; border-radius:3px; background:rgb(255 255 255 / .35); overflow:hidden}
.sv-bar i{display:block; height:100%; width:0; background:var(--paper); animation:fill 7s linear forwards}
.sv-head{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; margin-top:10px}
.sv-head small{display:block; font-size:11.5px; opacity:.85}
.sv-x{width:34px; height:34px; border-radius:50%; border:0; background:rgb(0 0 0 / .2); color:var(--on); font-size:20px; line-height:1}
.sv-text{align-self:center; margin:0; text-align:center; font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1.1; letter-spacing:-.01em; text-wrap:balance}
.sv-sticker{justify-self:center; display:grid; justify-items:center; gap:6px; padding:10px 16px; border-radius:20px; background:rgb(255 255 255 / .92); color:var(--ink); transform:rotate(-4deg); box-shadow:0 8px 20px rgb(0 0 0 / .2)}
.sv-sticker span{font-weight:800; font-size:12.5px}
.sv-sticker em{font-size:11.5px; color:var(--muted)}
.sheet-wrap{position:absolute; inset:0; z-index:15; display:flex; align-items:flex-end; background:rgb(19 48 79 / .4)}
.sheet{width:100%; display:grid; gap:6px; padding:18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); border-radius:22px 22px 0 0; background:var(--paper); animation:up .3s ease-out; max-height:85%; overflow-y:auto}
.sheet p{margin:0}
.sheet .center{display:grid; justify-items:center; gap:6px; text-align:center}
.toast{position:absolute; top:76px; left:14px; right:14px; z-index:25; display:flex; align-items:center; gap:10px; text-align:left; padding:9px 13px; border-radius:14px; border:1.5px solid var(--aqua); background:var(--paper); box-shadow:0 10px 24px rgb(19 48 79 / .22); font-weight:700; font-size:13.5px; animation:down .3s ease-out}

/* ---------- Guida ---------- */
.guide{padding:22px; border-radius:24px; background:rgb(255 255 255 / .84); border:2px solid var(--paper); box-shadow:0 14px 34px rgb(19 48 79 / .16); min-width:0}
.guide h1{font-family:var(--font-display); font-weight:700; font-size:34px; line-height:1; letter-spacing:-.03em; margin:0; color:var(--aqua-deep)}
.guide .tag{font-family:var(--font-pixel); font-size:17px; color:var(--pink); margin:6px 0 14px; background:none; padding:0}
.guide ol{margin:0; padding-left:20px; display:grid; gap:7px; font-size:14px}
.guide code{font-family:var(--font-pixel); font-size:16px; background:var(--cream); padding:0 5px; border-radius:6px}
.guide .note{font-size:12px; color:var(--muted); margin:14px 0 0}

/* ---------- Emoticon animate ---------- */
.emo .face, .piece .part{transform-box:fill-box; transform-origin:50% 90%}
.a-bounce .face{animation:e-bounce 1.4s ease-in-out infinite}
.a-wobble .face{animation:e-wobble 1.8s ease-in-out infinite}
.a-pulse .face{transform-origin:50% 50%; animation:e-pulse .9s ease-in-out infinite}
.a-float .face{animation:e-float 2.6s ease-in-out infinite}
.a-shiver .face{animation:e-shiver .32s linear infinite}
.emo .blink{transform-box:fill-box; transform-origin:50% 50%; animation:e-blink 3.8s infinite}
.wheel{transform-box:fill-box; transform-origin:50% 50%; animation:spin .9s linear infinite}
.smoke{animation:smoke 1.5s ease-out infinite}
.flame{transform-box:fill-box; transform-origin:0% 50%; animation:flick .16s ease-in-out infinite alternate}
.p-train .part{animation:chug .45s ease-in-out infinite}
.p-rocket .part{animation:e-float 1.6s ease-in-out infinite}
.p-bug .part{animation:wave 1s ease-in-out infinite; animation-delay:calc(var(--i, 0) * -.16s)}
.still, .still *{animation:none !important}

@keyframes e-bounce{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-5px) scale(.97,1.03)}80%{transform:translateY(0) scale(1.04,.96)}}
@keyframes e-wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes e-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes e-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes e-shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px) rotate(-2deg)}75%{transform:translateX(1.5px) rotate(2deg)}}
@keyframes e-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes smoke{0%{transform:translate(0,4px); opacity:0}30%{opacity:.9}100%{transform:translate(6px,-8px); opacity:0}}
@keyframes flick{from{transform:scaleX(.7)}to{transform:scaleX(1.12)}}
@keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}

/* ---------- Animazioni interfaccia ---------- */
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-10px,3px) rotate(-1deg)}20%{transform:translate(9px,-4px) rotate(1deg)}30%{transform:translate(-8px,4px)}40%{transform:translate(8px,-2px) rotate(.6deg)}50%{transform:translate(-6px,3px)}60%{transform:translate(5px,-3px)}70%{transform:translate(-3px,2px)}80%{transform:translate(3px,-1px)}90%{transform:translate(-1px,1px)}}
.shake{animation:shake .65s}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
@keyframes flip{0%{transform:perspective(600px) rotateY(180deg) scale(.6)}100%{transform:perspective(600px) rotateY(0) scale(1)}}
@keyframes sync-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fill{to{width:100%}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes down{from{transform:translateY(-30px); opacity:0}to{transform:translateY(0); opacity:1}}
@keyframes flash{50%{filter:brightness(1.3) saturate(1.4)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important}
  .shake{animation:flash .6s !important}
}
@media (max-width:440px){ .phone{border-radius:24px} }
</style>

<div class="stage">
  <main class="phone" id="phone">
    <header class="topbar">
      <span class="ava" id="meAva" style="--c:var(--pink)">S</span>
      <div style="min-width:0">
        <div class="me-row"><span class="me-nick" id="meNick"></span><select id="status" class="status-select"></select></div>
        <input id="pmInput" class="pm" maxlength="60">
      </div>
      <div class="brand"><span class="logo" aria-hidden="true">zing</span><div class="lang" id="lang"><button data-lang="en">EN</button><button data-lang="it">IT</button></div></div>
    </header>
    <section class="screens" id="screens"></section>
    <nav class="tabs" id="tabs"></nav>

    <div class="chat" id="chat" hidden>
      <div class="chat-head" id="chatHead"></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="typing" id="typing"></div>
      <div class="suggest" id="suggest" hidden></div>
      <div class="mixbar" id="mixbar" hidden></div>
      <div class="tray" id="tray" hidden></div>
      <form class="composer" id="composer">
        <button type="button" class="zing-btn" id="zingBtn" data-zing></button>
        <button type="button" class="icon-btn" data-tray id="trayBtn"></button>
        <input id="msgInput" autocomplete="off">
        <button type="submit" class="icon-btn" id="sendBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21.5 12 3 3.5v6.6L15 12 3 13.9z"/></svg></button>
      </form>
      <div class="chat-foot" id="chatFoot"></div>
    </div>

    <div class="prof" id="prof" hidden></div>
    <div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div class="overlay" id="overlay" hidden></div>
    <button class="toast" id="toast" hidden></button>
  </main>

  <aside class="guide" id="guide"></aside>
</div>

<script>

let actx = null;
function ac(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; } catch(e){ return null; } }
function tone(a, type, freqs, start, dur, vol){
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  freqs.forEach(([f, at]) => o.frequency.setValueAtTime(f, start + at));
  g.gain.setValueAtTime(.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + .02);
  g.gain.setValueAtTime(vol, start + dur - .08); g.gain.exponentialRampToValueAtTime(.0001, start + dur);
  o.connect(g).connect(a.destination); o.start(start); o.stop(start + dur + .02);
  return g;
}
function zingSound(delay = 0){
  const a = ac(); if (!a) return; const s = a.currentTime + delay;
  const g = tone(a, 'square', [[740,0],[988,.16],[1245,.3]], s, .5, .07);
  const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 26; lg.gain.value = .05;
  lfo.connect(lg).connect(g.gain); lfo.start(s); lfo.stop(s + .52);
}
function popSound(){ const a = ac(); if (!a) return; const s = a.currentTime; tone(a, 'sine', [[520,0],[780,.06],[1040,.12]], s, .26, .12); }
function clickSound(){ const a = ac(); if (!a) return; tone(a, 'triangle', [[880,0]], a.currentTime, .09, .06); }
function onlineSound(){ const a = ac(); if (!a) return; const s = a.currentTime; tone(a, 'triangle', [[660,0]], s, .18, .12); tone(a, 'triangle', [[990,0]], s + .14, .3, .12); }
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function zingFx(el){ zingSound(); buzz([90,40,90,40,160]); shakeEl(el); }

/* ---------- Chat ---------- */
function codeTable(){
  const m = new Map();
  CAT.forEach(e => { if (e.sc) m.set(e.sc.toLowerCase(), {ids:[e.id]}); if (e.code) m.set(':' + e.code + ':', {ids:[e.id]}); });
  MACROS.forEach(x => m.set(x.code, {ids:x.ids}));
  return m;
}
function withShortcuts(s){
  const tbl = codeTable();
  const re = new RegExp('(^|\\s)(' + [...tbl.keys()].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')(?=\\s|$|[.,!?])', 'gi');
  let out = '', last = 0, m;
  while ((m = re.exec(s))){
    const start = m.index + m[1].length, hit = tbl.get(m[2].toLowerCase());
    out += esc(s.slice(last, start));
    if (hit.ids.every(id => S.owned[id])){
      const e0 = E(hit.ids[0]);
      out += hit.ids.length > 1 ? `<span class="emo-inline seq">${hit.ids.map((id, k) => itemSVG(E(id), 26, k)).join('')}</span>` : `<span class="emo-inline" title="${esc(nm(e0))}">${itemSVG(e0, 22)}</span>`;
    } else out += esc(m[2]);
    last = start + m[2].length;
  }
  return out + esc(s.slice(last));
}
const fmtText = v => typeof v === 'string' ? withShortcuts(v) : esc(tx(v));
function suggestFor(text){
  const m = text.match(/(?:^|\s)(:[a-z0-9]*|\([a-z]*)$/i); if (!m) return [];
  const tok = m[1].toLowerCase(); if (tok.length < 2) return [];
  const out = [];
  if (tok[0] === ':'){ const q = tok.slice(1); CAT.filter(e => S.owned[e.id] && e.code && e.code.startsWith(q)).forEach(e => out.push({tok, code:':' + e.code + ':', ids:[e.id]})); }
  else {
    MACROS.filter(x => x.code.startsWith(tok) && x.ids.every(id => S.owned[id])).forEach(x => out.push({tok, code:x.code, ids:x.ids}));
    CAT.filter(e => S.owned[e.id] && e.sc && e.sc.toLowerCase().startsWith(tok)).forEach(e => out.push({tok, code:e.sc, ids:[e.id]}));
  }
  return out.slice(0, 8);
}
function renderSuggest(){
  const inp = $('#msgInput'), before = inp.value.slice(0, inp.selectionStart ?? inp.value.length), list = suggestFor(before), bar = $('#suggest');
  S.sug = list; bar.hidden = !list.length;
  const tok = (before.match(/(\S+)$/) || [])[1], hit = !list.length && tok && codeTable().get(tok.toLowerCase());
  if (hit && !hit.ids.every(id => S.owned[id])){ bar.hidden = false; bar.innerHTML = `<span class="sug locked"><span class="silhouette">${itemSVG(E(hit.ids[0]), 22, 0, false)}</span><code>${esc(tok)}</code>${t('sc_locked_one')}</span>`; return; }
  bar.innerHTML = list.map((x, k) => `<button type="button" class="sug" data-sug="${k}">${x.ids.length > 1 ? `<span class="emo-inline seq">${x.ids.map((id, j) => itemSVG(E(id), 20, j, false)).join('')}</span>` : itemSVG(E(x.ids[0]), 22, 0, false)}<code>${esc(x.code)}</code></button>`).join('');
}
function applySuggest(k){

function msgHTML(m, idx){
  const i = S.chat;
  if (m.t === 'zing') return `<div class="sys zing-pill">${m.from === 'me' ? t('zing_sent') : esc(t('zing_recv', {name:F[i].name}))}</div>`;

  if (m.t === 'sys') return `<div class="sys">${esc(tx(m.text))}</div>`;
  const mine = m.from === 'me';
  let b = '';
  if (m.text) b += `<p>${mine ? withShortcuts(m.text) : esc(tx(m.text))}</p>`;
  if (m.strip){
    const single = m.strip.length === 1, e0 = E(m.strip[0]);
    b += stripHTML(m.strip, single ? 56 : 42);
    if (single) b += `<span class="emo-name">${esc(nm(e0))}</span>`;

      else if (!miss.length) b += `<span class="took muted">${t('have')}</span>`;

function renderMessages(){
  const box = $('#msgs');
  box.innerHTML = S.chats[S.chat].map(msgHTML).join('') || `<div class="sys">${t('no_msgs')}</div>`;
  box.scrollTop = box.scrollHeight;
}
function renderChat(){
  const i = S.chat, f = F[i];
  $('#chatHead').innerHTML = `<button class="icon-btn" data-close-chat aria-label="${t('back')}">${ICON.back}</button><button class="ch-ava" data-dbl-zing aria-label="${t('zing_aria')}">${avaHTML(i, 'sm')}</button><button class="ch-info" data-profile="${i}" aria-label="${esc(t('open_wall', {name:f.name}))}"><b>${esc(f.name)}</b><small>${t('st_' + f.status)} · ${esc(tx(f.pm))}</small></button><button class="icon-btn heart ${S.crush.has(i) ? 'on' : ''}" data-crush aria-label="${t('crush_aria')}">${ICON.heart}</button>`;
  renderMessages(); renderTyping(); updateZingBtn();
}
function renderTyping(){ $('#typing').textContent = S.typing && S.typing === S.chat ? t('typing', {name:F[S.chat].name}) : ''; }
function renderTray(){
  const owned = CAT.filter(e => S.owned[e.id]);
  const btns = list => list.map(e => `<button type="button" data-add-mix="${e.id}" aria-label="${esc(nm(e))}" title="${esc(nm(e))} ${e.sc ? e.sc + ' ' : ''}:${e.code}:">${itemSVG(e, 32, 0, false)}</button>`).join('');
  $('#tray').innerHTML = `<p class="tray-hint">${t('mix_hint')} <button type="button" class="link-btn" data-shortcuts>${t('sc_all')}</button></p><div class="tray-label">${t('mix_faces')}</div><div class="tray-grid">${btns(owned.filter(e => !e.piece))}</div><div class="tray-label">${t('mix_parts')}</div><div class="tray-grid">${btns(owned.filter(e => e.piece))}</div>`;
}
function renderMix(){
  const bar = $('#mixbar');
  bar.hidden = !S.mix.length;
  bar.innerHTML = S.mix.length ? `<div class="strip">${S.mix.map((id, k) => `<button type="button" data-mix-remove="${k}" aria-label="${esc(nm(E(id)))}">${itemSVG(E(id), 36, k)}</button>`).join('')}</div><button type="button" class="mix-clear" data-mix-clear>${t('mix_clear')}</button>` : '';
  if (S.mix.length){ const s = bar.querySelector('.strip'); s.scrollLeft = s.scrollWidth; }
}
function updateZingBtn(){
  if (!S.chat) return;
  const left = (S.cool[S.chat] || 0) - Date.now(), btn = $('#zingBtn');
  btn.disabled = left > 0;
  const want = left > 0 ? String(Math.ceil(left / 1000)) : 'bolt';
  if (btn.dataset.show !== want){ btn.dataset.show = want; btn.innerHTML = left > 0 ? want : ICON.bolt; }
  $('#chatFoot').textContent = t('foot', {n:S.today});
}
setInterval(updateZingBtn, 250);

function openChat(i){
  if (S.profOpen) closeProf();
  S.chat = i; S.unread[i] = 0; S.zingedMe[i] = false; S.mix = [];
  $('#chat').hidden = false; $('#tray').hidden = true; renderTray(); renderMix();
  if (F[i].status === 'offline' && !S.chats[i].length) S.chats[i].push({t:'sys', text:n2(STR.en.offline_note.replace('{name}', F[i].name), STR.it.offline_note.replace('{name}', F[i].name))});
  renderChat(); renderTabs();
}
function closeChat(){ $('#chat').hidden = true; S.chat = null; renderAll(); }

function addMsg(i, m, quiet){
  S.chats[i].push(m);
  const open = S.chat === i && !$('#chat').hidden;
  if (open) renderMessages();
  else {
    if (m.from !== 'me' && !m.t){ S.unread[i] = (S.unread[i] || 0) + 1; if (!quiet) toast(`${F[i].name}: ${m.text ? tx(m.text) : t('sent_emo')}`, i); }
    renderTabs(); if (S.tab === 'amici' && $('#chat').hidden) renderScreen();
  }
}
const timers = {};
function scheduleReply(i, delay){
  const f = F[i]; if (f.status === 'offline') return;
  clearTimeout(timers[i]);
  timers[i] = setTimeout(() => {
    S.typing = i; if (S.chat === i) renderTyping();
    timers[i] = setTimeout(() => {
      S.typing = null; if (S.chat === i) renderTyping();
      const k = Math.floor(Math.random() * f.replies.en.length), m = {from:i, text:n2(f.replies.en[k], f.replies.it[k])};
      if (Math.random() < .45){ const p = pick(f.pool); m.strip = Array.isArray(p) ? p : [p]; }
      addMsg(i, m);
    }, 1200 + Math.random() * 900);
  }, delay);
}
function sendMessage(text){
  const i = S.chat; text = text.trim();
  if (!text && !S.mix.length) return;
  const m = {from:'me'}; if (text) m.text = text; if (S.mix.length) m.strip = S.mix.slice();
  S.mix = []; renderMix(); $('#tray').hidden = true;
  addMsg(i, m); scheduleReply(i, 900);
}

/* ---------- Zing ---------- */
function sendZing(i){
  const now = Date.now();
  if ((S.cool[i] || 0) > now) return;
  if (S.today >= 30){ toast(t('daily_out')); return; }
  S.today++; S.sent++; S.cool[i] = now + 5000; S.lastMine[i] = now;
  addMsg(i, {t:'zing', from:'me'}); zingFx(S.profOpen === i ? $('#prof') : $('#chat').hidden ? $('#phone') : $('#chat')); updateZingBtn();
  if (now - (S.lastTheirs[i] || 0) < 3000){ addMsg(i, {t:'combo'}); setTimeout(() => showCombo(i), 450); return; }
  const f = F[i]; if (f.status === 'offline') return;
  if (Math.random() < f.back) setTimeout(() => incomingZing(i), 900 + Math.random() * 1500);
  else scheduleReply(i, 2000);
}
function incomingZing(i){
  const now = Date.now(), open = S.chat === i && !$('#chat').hidden && !S.profOpen;
  S.recv++; S.lastTheirs[i] = now;
  if (!open) S.zingedMe[i] = true;
  addMsg(i, {t:'zing', from:i}, true);
  zingFx(open ? $('#chat') : $('#phone'));
  if (!open) toast(t('zing_recv', {name:F[i].name}).replace(/~ /g, '').replace(/ ~/g, ''), i);
  if (now - (S.lastMine[i] || 0) < 3000){ addMsg(i, {t:'combo'}); setTimeout(() => showCombo(i), 450); }
  else if (open) toast(t('combo_hint'));
}
function showCombo(i){
  zingSound(); zingSound(.2); buzz([60,30,60,30,60,30,200]);
  overlay(`<div class="sync"><div class="sync-avas"><span class="ava xl" style="--c:var(--pink)">${myInitial()}</span><span class="ava xl" style="--c:${F[i].c}">${initial(i)}</span></div><h2>${t('combo')}</h2><p>${esc(t('combo_text', {name:F[i].name}))}</p><button class="sync-btn" data-close-overlay>${t('combo_btn')}</button></div>`, 'calm');
}

/* ---------- Grab it ---------- */
function takeEmo(i, id){
  const e = E(id); if (S.owned[id]) return null;
  let extra = '';
  if (e.r !== 'comune'){
    const p = passesOf(i), period = t(e.r === 'leggendaria' ? 'month' : 'week');
    if (p[e.r] <= 0){ toast(t('passes_out', {name:F[i].name, r:rp(e.r), period})); return null; }
    p[e.r]--;
    extra = t('passes_left', {name:F[i].name, n:p[e.r], r:rp(e.r), period});
  }
  S.owned[id] = {from:F[i].name, date:'today'};
  return extra;
}
function grabMany(i, ids){
  const got = [], extras = [];
  for (const id of [...new Set(ids)]){ const x = takeEmo(i, id); if (x !== null){ got.push(id); if (x) extras.push(x); } }
  if (got.length){ popSound(); buzz(30); renderTray(); showCard(got, F[i].name, extras[extras.length - 1] || ''); }
  return got;
}
function showCard(ids, from, extra){
  const e = E(ids[0]), rest = ids.slice(1);
  overlay(`<div class="card-fig" style="--r:${RAR[e.r].c}"><span class="fig-tag">${t('new')}</span>${itemSVG(e, 96)}<h3>${esc(nm(e))}</h3><span class="rar-chip" style="--r:${RAR[e.r].c}">${rl(e.r)}${e.piece ? ' · ' + t('part') : ''}</span>${rest.length ? `${stripHTML(rest, 36)}<p class="small">${t('and_more', {n:rest.length})}</p>` : ''}<p>${t('from_line', {name:esc(from)})}</p>${extra ? `<p class="small">${esc(extra)}</p>` : ''}<button class="btn" data-close-overlay>${t('to_album')}</button></div>`);
}

/* ---------- Cotta segreta ---------- */
function openCrush(){
  const i = S.chat, f = F[i], has = S.crush.has(i), name = esc(f.name);
  sheet(`<h3>${t('crush_title')}</h3><p>${t('crush_text', {name})}</p><p class="small">${t('crush_used', {n:S.crush.size})}</p><button class="btn pink" data-crush-toggle>${has ? t('crush_remove') : t('crush_pick', {name})}</button><button class="btn ghost" data-close-sheet>${t('not_now')}</button>`);
}
function toggleCrush(){
  const i = S.chat, f = F[i]; closeSheet();
  if (S.crush.has(i)){ S.crush.delete(i); toast(t('crush_removed')); renderChat(); return; }
  if (S.crush.size >= 3){ toast(t('crush_full')); return; }
  S.crush.add(i); renderChat();
  if (f.mutual && !S.matched[i]) setTimeout(() => showMutual(i), 1400);
  else toast(t('crush_set'));
}
function showMutual(i){
  S.matched[i] = true;
  const e = E('cometa'), fresh = !S.owned.cometa;
  if (fresh) S.owned.cometa = {from:'destiny', date:'today'};
  renderTray(); addMsg(i, {t:'sys', text:n2(STR.en.mutual_sys, STR.it.mutual_sys)});
  zingSound(); buzz([120,60,120,60,300]);
  overlay(`<div class="sync"><div class="sync-avas"><span class="ava xl" style="--c:var(--pink)">${myInitial()}</span><span class="ava xl" style="--c:${F[i].c}">${initial(i)}</span></div><h2>${t('mutual')}</h2><p>${esc(t('mutual_text', {name:F[i].name}))}</p>${fresh ? `<div class="gift">${emoSVG(e.s, 64)}<b>${esc(nm(e))}</b><span class="rar-chip" style="--r:${RAR[e.r].c}">${t('mutual_gift', {r:rl(e.r)})}</span></div>` : ''}<button class="sync-btn" data-close-overlay>${t('mutual_btn')}</button></div>`, 'calm');
}

/* ---------- Storie ---------- */
let storyTimer = null;
function openStory(i){
  const f = F[i], st = f.story, e = E(st.emo); S.seenStory[i] = true;
  overlay(`<div class="story-view" style="background:${st.bg}"><div class="sv-bar"><i></i></div><div class="sv-head"><span class="ava sm" style="--c:${f.c}">${initial(i)}</span><span style="min-width:0"><b>${esc(f.name)}</b><small>${t('story_meta')}</small></span><button class="sv-x" data-close-overlay aria-label="${t('close_story')}">&times;</button></div><p class="sv-text">${esc(tx(st.text))}</p><div class="sv-sticker">${emoSVG(e.s, 80)}<span>${esc(nm(e))}</span>${S.owned[e.id] ? `<em>${t('have')}</em>` : `<button class="grab" data-take-story="${i}">${t('grab')}</button>`}</div></div>`, 'story');
  storyTimer = setTimeout(closeOverlay, 7000);
  if (S.tab === 'amici') renderScreen();
}

/* ---------- Album: dettaglio ---------- */
function holders(e){ const base = {comune:41200, noncomune:8300, rara:940, epica:118, leggendaria:14}[e.r]; let h = 0; for (const c of e.id) h = (h * 31 + c.charCodeAt(0)) % 997; return Math.round(base * (.7 + h / 1660)); }
const fmt = n => n.toLocaleString(L === 'it' ? 'it-IT' : 'en-US');
function fromLabel(o){ return o.from === 'starter' ? t('starter') : o.from === 'destiny' ? t('destiny_from') : o.from; }
function openEmo(id){
  const e = E(id), o = S.owned[id];
  const chip = `<span class="rar-chip" style="--r:${RAR[e.r].c}">${rl(e.r)}${e.piece ? ' · ' + t('part') : ''}${e.creator ? ' · ' + t('community') : ''}</span>`;
  if (!o){
    const show = e.r === 'comune' || e.r === 'noncomune';
    sheet(`<div class="center"><div class="silhouette">${itemSVG(e, 80)}</div><h3>${show ? esc(nm(e)) : '???'}</h3>${chip}<p>${t('missing_text')}</p><p class="small">${t('holders', {n:fmt(holders(e))})}</p></div><button class="btn ghost" data-close-sheet>${t('ok')}</button>`);
    return;
  }
  const inV = S.me.vetrina.includes(id);
  const who = e.creator ? t('only_you') : t('holders_pass', {n:fmt(holders(e)), m:fmt(holders(e) * 3)});
  const date = o.date === 'oct' ? t('oct') : o.date === 'today' ? t('today') : o.date;
  sheet(`<div class="center">${itemSVG(e, 80)}<h3>${esc(nm(e))}</h3>${chip}${e.sc ? `<p class="small">${t('shortcut', {s:esc(e.sc)})}</p>` : ''}<p>${o.pz ? t('created_by_you') : t('received_from', {name:esc(fromLabel(o)), date})}</p><p class="small">${who}</p></div>${inV ? `<p class="small" style="text-align:center">${t('in_showcase')}</p>` : `<button class="btn pink" data-vetrina="${id}">${t('put_showcase')}</button>`}<button class="btn ghost" data-close-sheet>${t('close')}</button>`);
}

/* ---------- Studio ---------- */
function submitEmo(){
  const name = S.studioName.trim();
  if (!name){ toast(t('need_name')); $('#emoName') && $('#emoName').focus(); return; }
  let code = (S.studioCode || name).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
  if (code.length < 2) code = 'my' + (Date.now() % 1000);
  if (codeTable().has(':' + code + ':') || S.creations.some(x => x.code === code)){ toast(t('code_taken')); return; }
  const c = {id:'u' + Date.now(), name, code, spec:{...S.studio}, ok:false};
  S.creations.unshift(c); S.studioName = ''; S.studioCode = ''; renderScreen();
  toast(t('sent_review'));
  setTimeout(() => {
    c.ok = true;
    CAT.push({id:c.id, name:c.name, code:c.code, r:'noncomune', s:c.spec, creator:true});
    S.owned[c.id] = {from:'me', date:'today', pz:true}; renderTray(); popSound();
    toast(t('approved_toast', {name:c.name}));
    if (S.tab === 'studio' || S.tab === 'album') renderScreen();
  }, 3500);
}

/* ---------- Overlay, sheet, toast ---------- */
function overlay(html, cls = ''){ clearTimeout(storyTimer); const o = $('#overlay'); o.className = 'overlay ' + cls; o.innerHTML = html; o.hidden = false; const b = o.querySelector('button'); b && b.focus({preventScroll:true}); }
function closeOverlay(){ clearTimeout(storyTimer); $('#overlay').hidden = true; $('#overlay').innerHTML = ''; if (S.profOpen) renderProf(); else if ($('#chat').hidden) renderScreen(); }
function sheet(html){ $('#sheet').innerHTML = html; $('#sheetWrap').hidden = false; }
function closeSheet(){ $('#sheetWrap').hidden = true; }
let toastT = null;
function toast(text, open){
  const el = $('#toast'); el.textContent = text; el.dataset.toastOpen = open || ''; el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2800);
}

/* ---------- Eventi ---------- */
let lastAvaTap = 0;
document.addEventListener('click', ev => {
  if (ev.target === $('#overlay')){ closeOverlay(); return; }
  if (ev.target === $('#sheetWrap')){ closeSheet(); return; }
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.lang){ L = d.lang; try { localStorage.setItem('zing-lang', L); } catch(e){} renderStatic(); renderAll(); }
  else if (d.tab){ S.tab = d.tab; if (S.profOpen) closeProf(); if (!$('#chat').hidden){ $('#chat').hidden = true; S.chat = null; } renderAll(); $('#screens').scrollTop = 0; }
  else if (d.open) openChat(d.open);
  else if ('closeChat' in d) closeChat();
  else if (d.profile) openProf(d.profile);
  else if ('closeProf' in d) closeProf();
  else if ('zing' in d) sendZing(S.chat);
  else if (d.zingFrom) sendZing(d.zingFrom);
  else if ('dblZing' in d){ const now = Date.now(); if (now - lastAvaTap < 350){ lastAvaTap = 0; sendZing(S.chat); } else lastAvaTap = now; }
  else if ('tray' in d){ $('#tray').hidden = !$('#tray').hidden; }
  else if (d.addMix){ if (S.mix.length < 12){ S.mix.push(d.addMix); clickSound(); renderMix(); } }
  else if (d.mixRemove !== undefined){ S.mix.splice(+d.mixRemove, 1); renderMix(); }
  else if ('mixClear' in d){ S.mix = []; renderMix(); }
  else if (d.take !== undefined){
    const m = S.chats[S.chat][+d.take], got = grabMany(S.chat, m.strip);
    if (got.length){ m.taken = true; renderMessages(); }
  }
  else if (d.takeStory){ grabMany(d.takeStory, [F[d.takeStory].story.emo]); }
  else if ('crush' in d) openCrush();
  else if ('crushToggle' in d) toggleCrush();
  else if (d.story) openStory(d.story);
  else if (d.emo) openEmo(d.emo);
  else if (d.vetrina){ S.me.vetrina = [d.vetrina, ...S.me.vetrina.filter(x => x !== d.vetrina)].slice(0, 3); closeSheet(); toast(t('showcased')); if (S.tab === 'profilo') renderScreen(); }
  else if (d.opt){ S.studio[d.opt] = d.val; renderScreen(); }
  else if (d.skin){ S.skin = d.skin; applySkin(); renderStatic(); renderAll(); }
  else if (d.reserve) openCheckout(DROPS.find(x => x.id === d.reserve));
  else if (d.parent){
    const dr = DROPS.find(x => x.id === d.parent); closeSheet(); toast(t('parent_sent'));
    setTimeout(() => { dr.reserved = true; dr.stock = Math.max(0, dr.stock - 1); if (S.tab === 'drops') renderScreen(); grantDrop(dr, t('parent_ok')); }, 1800);
  }
  else if (d.remind){ const dr = DROPS.find(x => x.id === d.remind); dr.remind = !dr.remind; if (dr.remind) toast(t('remind_toast')); renderScreen(); }
  else if (d.scan){ const dr = DROPS.find(x => x.id === d.scan); grantDrop(dr); }
  else if (d.shop) openShop(d.shop);
  else if (d.follow){ S.follows[d.follow] = !S.follows[d.follow]; openShop(d.follow); }
  else if ('b2b' in d) openB2B();
  else if (d.sug !== undefined) applySuggest(+d.sug);
  else if ('shortcuts' in d) openShortcuts();
  else if ('toggleMissing' in d){ S.showMissing = !S.showMissing; renderScreen(); }
  else if ('submitEmo' in d) submitEmo();
  else if (d.react){ const [o, k, id] = d.react.split('|'); toggleReact(o, +k, id); }
  else if (d.reactAdd){ const [o, k] = d.reactAdd.split('|'); openReactPicker(o, +k); }
  else if (d.pickReact){ const [o, k] = S.reactTarget; closeSheet(); const p = P[o].posts[k]; p.mine = p.mine || []; if (!p.mine.includes(d.pickReact)) toggleReact(o, k, d.pickReact); }
  else if (d.toggleComments){ const [o, k] = d.toggleComments.split('|'); const p = P[o].posts[+k]; p.open = !p.open; rerenderWall(o); }
  else if (d.draftMode){ S.draft.mode = d.draftMode; rerenderWall('me'); }
  else if (d.scene){ S.draft.scene = d.scene; S.draft.img = null; rerenderWall('me'); }
  else if ('publish' in d) publishPost();
  else if ('customize' in d) openCustomize();
  else if (d.themePick){ S.me.theme = d.themePick; openCustomize(); rerenderWall('me'); }
  else if (d.mood !== undefined){ S.me.mood = +d.mood; openCustomize(); rerenderWall('me'); }
  else if ('saveProfile' in d){ S.me.song = ($('#songInput') || {}).value || ''; closeSheet(); rerenderWall('me'); toast(t('saved')); }
  else if (d.notify){
    const i = d.notify; if (S.notify[i]) return;
    S.notify[i] = true; renderScreen(); toast(t('notify_set', {name:F[i].name}));
    setTimeout(() => { F[i].status = 'online'; S.notify[i] = false; onlineSound(); buzz(40); toast(t('is_online', {name:F[i].name}), i); renderAll(); }, 6000);
  }
  else if ('closeOverlay' in d) closeOverlay();
  else if ('closeSheet' in d) closeSheet();
  else if ('sim' in d) incomingZing('sara');
  else if (b.id === 'toast'){ b.hidden = true; if (d.toastOpen) openChat(d.toastOpen); }
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  if (f.id === 'composer'){ ev.preventDefault(); const inp = $('#msgInput'); sendMessage(inp.value); inp.value = ''; renderSuggest(); return; }
  if (f.dataset.cform){
    ev.preventDefault();
    const input = f.querySelector('input'), text = input.value.trim(); if (!text) return;
    const [o, k] = f.dataset.cform.split('|');
    if (k === 'gb') P[o].guestbook.push({from:'me', text}); else { P[o].posts[+k].comments.push({from:'me', text}); P[o].posts[+k].open = true; }
    clickSound(); rerenderWall(o);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!$('#overlay').hidden) closeOverlay(); else if (!$('#sheetWrap').hidden) closeSheet(); else if (S.profOpen) closeProf();
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'emoName') S.studioName = el.value;
  else if (el.id === 'emoCode') S.studioCode = el.value;
  else if (el.id === 'msgInput') renderSuggest();
  else if (el.id === 'nickInput'){ S.nick = el.value || '~*Simo*~'; renderMe(); }
  else if (el.id === 'pmInput'){ S.pm = el.value; S.pmEdited = true; }
  else if (el.id === 'draftText') S.draft.text = el.value;
  else if (el.id === 'draftTitle') S.draft.title = el.value;
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'status') S.status = el.value;
  else if (el.id === 'quiet') S.quiet = el.checked;
  else if (el.id === 'postFile' && el.files && el.files[0]){
    const r = new FileReader();
    r.onload = () => { S.draft.img = r.result; rerenderWall('me'); };
    r.readAsDataURL(el.files[0]);
  }
});

$('#trayBtn').innerHTML = emoSVG(E('sorriso').s, 24, false);
applySkin(); renderStatic(); renderMe(); renderAll();
})();
</script>
